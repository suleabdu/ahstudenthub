.header-actions{display:flex;gap:.4rem;align-items:center;flex-wrap:wrap}.notice-button{position:relative}.notice-count{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 4px;margin-left:5px;border-radius:99px;background:var(--red);color:#fff;font-size:.72rem;line-height:1;font-variant-numeric:tabular-nums}.walk-steps{margin:.8rem 0;padding-left:1.25rem}.walk-steps li{margin:.45rem 0}.recipient-list{display:grid;gap:.45rem;margin:.7rem 0}.recipient{display:flex;gap:.65rem;align-items:flex-start;padding:.65rem;border:1px solid var(--line);border-radius:8px;background:#fff}.recipient input{width:auto;min-height:0;margin-top:.2rem}.recipient small{display:block;color:var(--ink2)}
  .hit{display:flex;justify-content:space-between;gap:1rem;width:100%;text-align:left;background:#fff;color:var(--ink);border:1px solid var(--line);margin-top:.3rem}.hit:disabled{opacity:.65;cursor:not-allowed}
  table.sale-lines{min-width:760px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin-top:.7rem;padding-top:.7rem;border-top:1px solid var(--line)}.stats b{display:block;font:700 1.1rem inherit;font-variant-numeric:tabular-nums}.stats span{font-size:.82rem;color:var(--ink2)}.stats .spent b{color:var(--red)}
.total{font:700 1.5rem inherit;font-variant-numeric:tabular-nums}
.center{min-height:100vh;display:grid;place-items:center;padding:1rem}.center .card{width:100%;max-width:400px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:1rem;z-index:99;display:flex;flex-direction:column;gap:.4rem;align-items:center}
#toast div{background:var(--ink);color:#fff;padding:.7rem 1.1rem;border-radius:8px}#toast .err{background:var(--red)}
.overlay{position:fixed;inset:0;background:#0007;display:flex;justify-content:center;align-items:flex-start;padding:4vh 1rem;overflow:auto;z-index:40}.modal{background:#fff;border-radius:12px;padding:1.2rem;width:100%;max-width:460px}
#receipt{display:none}
  /* Phone-first refinements. The sales app is used at the counter, often with
     one hand, so forms keep one deliberate column and the sale table becomes
     compact record cards instead of forcing a wide horizontal spreadsheet. */
  @media(max-width:760px){
    html{background:var(--paper)}body{min-width:320px;overflow-x:hidden;font-size:15px;padding-bottom:env(safe-area-inset-bottom)}
    header{padding:.55rem .7rem;gap:.45rem;padding-top:max(.55rem,env(safe-area-inset-top))}header .co{flex:1 1 100%;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:1rem}header .pill{max-width:calc(50% - .3rem);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .header-actions{width:100%;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.35rem}.header-actions button{width:100%;min-width:0;padding:.45rem .25rem;font-size:.76rem;line-height:1.15;white-space:normal}
    nav{gap:.25rem;padding:.42rem .5rem;scroll-snap-type:x proximity;scroll-padding-inline:.5rem}nav button{flex:0 0 auto;scroll-snap-align:start;padding:.45rem .65rem;font-size:.88rem;min-height:42px}
    main{padding:.7rem;max-width:100%}.card{padding:.8rem;border-radius:9px;margin-bottom:.75rem}.grid{grid-template-columns:1fr;gap:.65rem}.row{display:grid;grid-template-columns:minmax(0,1fr);gap:.65rem;align-items:stretch}.row>*{min-width:0}.row>.fit{width:100%}.row>.fit button{width:100%}
    input,select,textarea{font-size:16px}.big{font-size:1.25rem}.total{font-size:1.35rem}.muted,.hint{font-size:.86rem}.banner{padding:.65rem .75rem}.banner button{margin-top:.45rem;width:100%}
    .hit{gap:.3rem;padding:.65rem;align-items:stretch;flex-direction:column}.hit span:last-child{font-size:.84rem;white-space:normal}.recipient{padding:.6rem;gap:.55rem}.stats{grid-template-columns:1fr 1fr;gap:.5rem}.stats b{font-size:1rem}
    .scroll{margin-inline:-.15rem;padding-inline:.15rem}.scroll>table{min-width:520px}.scroll>table.sale-lines{min-width:0;width:100%}
    table.sale-lines,table.sale-lines tbody{display:block;width:100%}table.sale-lines thead{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}table.sale-lines tr{display:block;margin:.65rem 0;padding:.7rem .75rem;border:1px solid var(--line);border-radius:9px;background:#fff}table.sale-lines tr:first-child{margin-top:0}table.sale-lines td{display:flex;align-items:center;justify-content:space-between;gap:.75rem;padding:.28rem 0;border:0;text-align:right;min-width:0}table.sale-lines td::before{font-size:.78rem;font-weight:600;color:var(--ink2);text-align:left;white-space:nowrap}table.sale-lines td:nth-child(1){display:block;padding:0 0 .45rem;text-align:left;border-bottom:1px solid var(--line);margin-bottom:.18rem}table.sale-lines td:nth-child(1)::before,table.sale-lines td:nth-child(7)::before{content:''}table.sale-lines td:nth-child(2)::before{content:'Quantity'}table.sale-lines td:nth-child(3)::before{content:'Unit cost'}table.sale-lines td:nth-child(4)::before{content:'Selling price'}table.sale-lines td:nth-child(5)::before{content:'Available'}table.sale-lines td:nth-child(6)::before{content:'Line total'}table.sale-lines td:nth-child(7){justify-content:flex-end;padding-top:.45rem}table.sale-lines td input{width:min(48vw,150px)!important;min-height:40px;margin-left:auto}table.sale-lines td:nth-child(7) button{min-width:44px}
    .overlay{padding:max(1vh,env(safe-area-inset-top)) .55rem max(1vh,env(safe-area-inset-bottom));align-items:flex-end}.modal{padding:1rem;max-height:94dvh;overflow-y:auto;border-radius:12px 12px 8px 8px}.center{min-height:100dvh;padding:.7rem}.center .card{max-width:430px}.center .row{display:flex;flex-wrap:wrap}.center .row>.fit{width:auto}.center .row>.fit button{width:auto}
    #toast{left:.6rem;right:.6rem;transform:none;bottom:max(.75rem,env(safe-area-inset-bottom));pointer-events:none}#toast div{width:100%;max-width:520px;padding:.7rem .85rem;text-align:center}
  }
  @media(max-width:380px){.header-actions{grid-template-columns:1fr 1fr}.header-actions button:last-child{grid-column:1/-1}.stats{grid-template-columns:1fr}.stats>div{display:flex;align-items:baseline;justify-content:space-between;gap:.75rem}.stats b{order:2}.stats span{order:1}.card{padding:.7rem}main{padding:.55rem}}
  @media(min-width:761px) and (max-width:1024px){main{max-width:900px;padding:1rem}.grid{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}.row>*{flex-basis:180px}.header-actions button{padding:.5rem .7rem}}
  @media print{body>*{display:none!important}#receipt{display:block!important;width:78mm;margin:0;font:12px/1.35 monospace;color:#000}#receipt table td,#receipt table th{border:0;padding:1px 0}}
</style>

<body>
<div id="app"></div><div id="toast"></div><div id="receipt"></div>
<script src="runtime-config.js"></script>
<script>
/* ============================================================
   >>> OWNER: paste your web app link between the quotes below once, before copying this file to the reps' PCs.
   ============================================================ */
const DEFAULT_API_URL = '';

(function () {
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// What belongs to the PC (server link, sign-in, PIN lock) is stored once. Everything a person produces (waiting entries, history,
// price list, counters, half-filled forms) is stored under that person's own name, so nobody ever sees another person's work.
let WHO = '';
const SCOPED = ['queue', 'failed', 'syncIssue', 'hist', 'snap', 'lastSync', 'docseq', 'newseq', 'epoch', 'drafts', 'tourDone', 'noticeSeen', 'noticePrompted'];
const skey = k => 'cb_' + (SCOPED.indexOf(k) >= 0 ? 'u_' + WHO + '_' : '') + k;
const LSget = (k, d) => { try { const v = localStorage.getItem(skey(k)); return v == null ? d : JSON.parse(v); } catch (e) { return d; } };
let storageWarningAt = 0;
const storageWarning = () => { const now = Date.now(); if (now - storageWarningAt > 5000) toast('This browser cannot store data. Do not close the app and tell your manager.', true); storageWarningAt = now; };
const LSset = (k, v) => { try { localStorage.setItem(skey(k), JSON.stringify(v)); return true; } catch (e) { storageWarning(); return false; } };
const whoOf = a => a && a.user && a.user.username ? String(a.user.username).toLowerCase().replace(/[^a-z0-9._-]/g, '') : '';
const uid = () => crypto.randomUUID ? crypto.randomUUID() : 'id-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
const pad = (n, l = 2) => String(n).padStart(l, '0');
const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
const weekStartStr = () => { const d = new Date(); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };

const RUNTIME = window.CASHBOOK_RUNTIME || {};
const apiUrlKind = value => {
  try {
    const u = new URL(String(value || ''));
    const script = u.protocol === 'https:' && /^script\.google(usercontent)?\.com$/i.test(u.hostname);
    const supabase = ((u.protocol === 'https:' && /\.supabase\.co$/i.test(u.hostname)) || (u.protocol === 'http:' && /^(localhost|127\.0\.0\.1)$/i.test(u.hostname))) && /^\/functions\/v1\/cashbook-api\/?$/i.test(u.pathname);
    return script ? 'apps-script' : supabase ? 'supabase' : '';
  } catch (e) { return ''; }
};
const normalApiUrl = value => { try { const u = new URL(String(value || '')); return apiUrlKind(u.href) ? u.href.replace(/\/$/, '') : ''; } catch (e) { return ''; } };
const validSupabaseKey = value => /^(sb_publishable_|sb_anon_)[A-Za-z0-9._-]{16,}$/.test(String(value || '').trim());
try {
  const p = new URLSearchParams(location.search), q = normalApiUrl(p.get('api'));
  const key = String(p.get('key') || '').trim();
  if (q) localStorage.setItem('cb_api', JSON.stringify(q));
  if (validSupabaseKey(key)) localStorage.setItem('cb_supabase_key', JSON.stringify(key));
  if (q || key) history.replaceState(null, '', location.pathname);
} catch (e) {}
let SUPABASE_PUBLISHABLE_KEY = validSupabaseKey(LSget('supabase_key', '')) ? LSget('supabase_key', '') : (validSupabaseKey(RUNTIME.supabasePublishableKey) ? String(RUNTIME.supabasePublishableKey).trim() : '');
const S = {
  api: normalApiUrl(LSget('api', '')) || normalApiUrl(DEFAULT_API_URL) || normalApiUrl(RUNTIME.supabaseFunctionUrl) || '', auth: LSget('auth', null), lock: LSget('lock', null), snap: null, queue: [], failed: [], syncIssue: null, hist: [], lastSync: null, epoch: null,
  unlocked: false, needLogin: false, syncing: false, screen: 'home', unlockFails: 0
};
function loadMine() { WHO = whoOf(S.auth); S.snap = WHO ? LSget('snap', null) : null; S.queue = WHO ? LSget('queue', []) : []; S.failed = WHO ? LSget('failed', []) : []; S.syncIssue = WHO ? LSget('syncIssue', null) : null; S.hist = WHO ? LSget('hist', []) : []; S.lastSync = WHO ? LSget('lastSync', null) : null; S.epoch = WHO ? LSget('epoch', null) : null; DRAFT = WHO ? LSget('drafts', {}) : {}; if (!Array.isArray(S.queue)) S.queue = []; if (!Array.isArray(S.failed)) S.failed = []; }
let DRAFT = {};
(function migrateOldStorage() {            // version 1.1 kept everything in shared keys: hand it to whoever is signed in
  try { const u = whoOf(S.auth); if (!u) return;
    ['queue', 'hist', 'snap', 'lastSync', 'docseq', 'newseq'].forEach(k => { const old = localStorage.getItem('cb_' + k); if (old != null) { if (localStorage.getItem('cb_u_' + u + '_' + k) == null) localStorage.setItem('cb_u_' + u + '_' + k, old); localStorage.removeItem('cb_' + k); } });
  } catch (e) {}
})();
loadMine();
const persist = () => {
  // The pending queue is the durable source for a newly saved action. Return
  // only that write's result so a non-critical cache write cannot falsely tell
  // the user that their already-stored action was lost.
  const queueSaved = LSset('queue', S.queue);
  LSset('failed', S.failed); LSset('syncIssue', S.syncIssue); LSset('hist', S.hist);
  LSset('snap', S.snap); LSset('lastSync', S.lastSync); LSset('epoch', S.epoch); LSset('auth', S.auth);
  return queueSaved;
};
const cur = () => (S.snap && S.snap.currency) || '₦';
const money = n => cur() + Number(n || 0).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
// Dashboard cards are deliberately currency-neutral. This avoids a missing
// or legacy currency symbol rendering as "?" while leaving receipts, forms
// and transaction detail correctly formatted with the configured currency.
const dashboardAmount = n => Number(n || 0).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
const qty = n => Number(n || 0).toLocaleString('en-US', {maximumFractionDigits: 4});
function toast(msg, err) { const t = document.createElement('div'); if (err) t.className = 'err'; t.textContent = msg; $('#toast').appendChild(t); setTimeout(() => t.remove(), err ? 6000 : 2800); }

/* ---------- local PIN lock (convenience lock for shared PCs; the real security is the server login) ---------- */
async function lockHash(salt, pin) {
  const data = salt + ':' + pin;
  if (window.crypto && crypto.subtle) { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(data)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join(''); }
  let h = 5381; for (let i = 0; i < data.length; i++) h = ((h << 5) + h + data.charCodeAt(i)) | 0; return 'x' + h;
}

/* ---------- server calls ---------- */
async function call(action, data, ms) {
  if (!S.api) throw {code: 'CONFIG', message: 'The server link is not set. Open Settings and paste it, or ask your manager.'};
  const kind = apiUrlKind(S.api), supabase = kind === 'supabase';
  if (!kind) throw {code: 'CONFIG', message: 'The server link is not an approved Cashbook endpoint.'};
  if (supabase && !SUPABASE_PUBLISHABLE_KEY) throw {code: 'CONFIG', message: 'Supabase public key missing. Open the manager-provided install link again.'};
  const ctrl = new AbortController(), t = setTimeout(() => ctrl.abort(), ms || 30000);
  try {
    const headers = {'Content-Type': supabase ? 'application/json' : 'text/plain;charset=utf-8'};
    if (supabase) { headers.apikey = SUPABASE_PUBLISHABLE_KEY; if (S.auth && S.auth.token) headers.Authorization = 'Bearer ' + S.auth.token; }
    const res = await fetch(S.api, {method: 'POST', headers, redirect: 'follow', signal: ctrl.signal,
      body: JSON.stringify(Object.assign({action, token: S.auth && S.auth.token}, data || {}))});
    const j = await res.json();
    if (!j.ok) throw {code: j.code || 'SERVER', message: j.error || 'Server error'};
    return j.data;
  } catch (e) { if (e && e.code) throw e; throw {code: 'NET', message: 'Cannot reach the server (no internet?). Your entries are safe on this PC.'}; }
  finally { clearTimeout(t); }
}

async function sync(manual) {
  if (S.syncing || !S.auth) return;
  S.syncing = true; renderStatus();
  try {
    let guard = 0;
    do {
      const batch = S.queue.slice(0, 40);
      const data = await call('sync', {epoch: S.epoch || undefined, entries: batch.map(e => { const c = {}; Object.keys(e).forEach(k => { if (k[0] !== '_') c[k] = e[k]; }); return c; })});
      if (data.epochChanged) { handleReset(data.snapshot); break; }
      const done = {}; data.results.forEach(r => done[r.clientId] = r); const at = new Date().toISOString();
      batch.forEach(e => { const r = done[e.clientId]; if (!r) return; recordSyncResult(e, r, at); });
      S.queue = S.queue.filter(e => !done[e.clientId]); S.hist = S.hist.slice(0, 300);
      S.snap = data.snapshot; S.epoch = data.snapshot.epoch || S.epoch; S.lastSync = at; S.syncIssue = null; persist();
      if (!Object.keys(done).length) break;
    } while (S.queue.length && ++guard < 30);
    S.needLogin = false;
    if (manual) toast(failed() ? failed() + ' action' + (failed() === 1 ? ' needs' : 's need') + ' attention in Sync centre.' : 'Synced', !!failed());
  } catch (e) { if (e.code === 'AUTH') S.needLogin = true; S.syncIssue = {kind: e.code === 'AUTH' ? 'AUTH' : 'TRANSPORT', code: e.code || 'NET', message: e.message || 'Could not reach the server.', at: new Date().toISOString()}; persist(); if (manual || e.code === 'AUTH') toast(e.message, true); }
  S.syncing = false; softRefresh();
}
// Keep a server-rejected action intact on this device. It is intentionally not
// retried automatically: validation/permission errors need a person to decide
// when a retry is appropriate. The original clientId remains unchanged, so an
// explicit retry is idempotent if the server actually completed it first.
function recordSyncResult(e, r, at) {
  const rejected = r.status === 'ERROR' || r.status === 'REJECTED';
  const summary = {clientId: e.clientId, type: e.type, label: e._label, amount: e._total, date: e.date, docNo: r.docNo || e.docNo, status: rejected ? 'REJECTED' : 'SYNCED', message: r.message || '', flags: r.flags || [], at, seen: !rejected};
  const oldHistory = S.hist.findIndex(h => h.clientId === e.clientId);
  if (oldHistory >= 0) S.hist[oldHistory] = Object.assign({}, S.hist[oldHistory], summary); else S.hist.unshift(summary);
  const previous = S.failed.find(x => x.entry && x.entry.clientId === e.clientId);
  S.failed = S.failed.filter(x => !x.entry || x.entry.clientId !== e.clientId);
  if (rejected) S.failed.unshift({entry: JSON.parse(JSON.stringify(e)), message: summary.message || 'The server rejected this action.', at, attempts: (previous ? +previous.attempts || 0 : 0) + 1});
}
// The office wiped its data (factory reset). Entries still waiting here belong to the old books, so they are saved to a file and cleared.
function handleReset(snap) {
  const n = S.queue.length + S.failed.length;
  if (n) { const blob = new Blob([JSON.stringify({note: 'Actions held on this device when the office reset its data', savedAt: new Date().toISOString(), user: S.auth.user, entries: S.queue, failed: S.failed, syncIssue: S.syncIssue}, null, 1)], {type: 'application/json'}); const a = document.createElement('a'), url = URL.createObjectURL(blob); a.href = url; a.download = 'cashbook-before-reset-' + todayStr() + '.json'; a.click(); setTimeout(() => URL.revokeObjectURL(url), 1000); }
  S.queue = []; S.failed = []; S.syncIssue = null; S.hist = []; S.snap = snap; S.epoch = snap.epoch; S.lastSync = new Date().toISOString(); persist();
  alert('The office has reset its records, so this app was refreshed.' + (n ? '\n\n' + n + ' action' + (n > 1 ? 's were' : ' was') + ' saved to a file in your Downloads folder and removed. Give the file to your manager.' : ''));
}
const REFRESH_MS = 120000;   // while the app is open and online: send waiting entries and refresh prices, stock and totals about every 2 minutes
setInterval(() => { if (navigator.onLine && S.auth && !S.needLogin && S.unlocked && !document.hidden && (S.queue.length || !S.lastSync || Date.now() - Date.parse(S.lastSync) > REFRESH_MS - 5000)) sync(false); }, 30000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && navigator.onLine && S.auth && S.unlocked && !S.needLogin && (!S.lastSync || Date.now() - Date.parse(S.lastSync) > 30000)) sync(false); });
window.addEventListener('online', () => { if (S.auth && S.unlocked) sync(false); });
window.addEventListener('offline', renderStatus);

/* ---------- helpers on local data ---------- */
function allProducts() {
  const base = S.snap ? S.snap.products : [], have = {}; base.forEach(p => have[p.sku] = true);

  m.innerHTML = `<div class="row"><div><h2>Daily WhatsApp summary</h2><p class="muted">Choose one or more owner-approved Chairman or CEO recipients. Cashbook only opens WhatsApp with the prepared message; you decide whether to send it.</p></div><div class="fit"><button class="ghost" id="wa-refresh">Refresh activity</button></div></div><div class="card"><label>Today’s summary</label><textarea id="wa-text" rows="11">${esc(initial)}</textarea><p class="hint">You may refine the wording before opening WhatsApp. Figures include this device’s entries waiting to sync.</p></div><div class="card"><div class="row"><div><h3>Approved recipients</h3><p class="hint" id="wa-status">Loading Chairman and CEO recipients…</p></div><div class="fit"><label class="hint"><input type="checkbox" id="wa-all" style="width:auto;min-height:0"> Select all</label></div></div><div id="wa-recipients" class="recipient-list"></div><div class="row" style="margin-top:1rem"><div class="fit"><button class="ghost" id="wa-reload">Reload recipients</button></div><div class="fit"><button id="wa-open" disabled>Open selected WhatsApp chats</button></div></div></div>`;
  let recipients = [];
  const list = m.querySelector('#wa-recipients'), status = m.querySelector('#wa-status'), all = m.querySelector('#wa-all'), open = m.querySelector('#wa-open');
  const draw = () => {
    if (!list || !status || !open) return;
    if (!recipients.length) { list.innerHTML = ''; open.disabled = true; status.textContent = 'No approved Chairman or CEO WhatsApp recipients are available yet. Ask the owner to add them in the Owner app.'; return; }
    status.textContent = 'Choose who should receive this summary.';
    list.innerHTML = recipients.map((r, i) => `<label class="recipient"><input type="checkbox" data-wa-recipient="${i}"><span><b>${esc(r.name)}</b><small>${esc(r.position)} · ${esc(r.whatsapp)}</small></span></label>`).join('');
    const syncChoice = () => { const selected = [...list.querySelectorAll('[data-wa-recipient]:checked')].length; open.disabled = !selected; if (all) all.checked = selected === recipients.length; };
    list.querySelectorAll('[data-wa-recipient]').forEach(c => c.onchange = syncChoice);
    if (all) all.onchange = () => { list.querySelectorAll('[data-wa-recipient]').forEach(c => { c.checked = all.checked; }); syncChoice(); };
    syncChoice();
  };
  const load = async () => {
    if (status) status.textContent = 'Loading approved recipients…'; if (open) open.disabled = true;
    try {
      const data = await call('whatsAppRecipients', {}, 15000);
      if (!m.isConnected || S.screen !== 'summary') return;
      recipients = approvedWhatsAppRecipients(data); draw();
    } catch (e) {
      if (!m.isConnected || S.screen !== 'summary') return;
      recipients = []; if (status) status.textContent = 'Recipients are not available yet. Ask the owner to add Chairman or CEO WhatsApp contacts, then Force Refresh.'; if (list) list.innerHTML = '';
    }
  };
  const refresh = m.querySelector('#wa-refresh'); if (refresh) refresh.onclick = async () => { await forceRefresh(); const text = m.querySelector('#wa-text'); if (text) text.value = dailySummaryText(); };
  const reload = m.querySelector('#wa-reload'); if (reload) reload.onclick = load;
  if (open) open.onclick = () => {
    const text = (m.querySelector('#wa-text') || {}).value || dailySummaryText();
    const chosen = [...(list ? list.querySelectorAll('[data-wa-recipient]:checked') : [])].map(c => recipients[+c.dataset.waRecipient]).filter(Boolean);
    if (!chosen.length) return toast('Select at least one approved recipient.', true);
    let opened = 0; chosen.forEach(r => { const n = whatsappNumber(r.whatsapp); if (!n) return; const w = window.open('https://wa.me/' + n + '?text=' + encodeURIComponent(text), '_blank', 'noopener'); if (w) opened++; });
    toast(opened ? `Opened ${opened} WhatsApp chat${opened === 1 ? '' : 's'} with your prepared summary.` : 'Your browser blocked the WhatsApp windows. Allow pop-ups, then try again.', !opened);
  };
  load();
}

const barcodeFormats = ['ean_13', 'ean_8', 'code_128', 'code_39', 'upc_a', 'upc_e', 'qr_code'];
function readImageData(file) {
  return new Promise((resolve, reject) => { const reader = new FileReader(); reader.onload = () => resolve(String(reader.result || '')); reader.onerror = () => reject(new Error('Could not read that image.')); reader.readAsDataURL(file); });
}
async function compactImageData(file) {
  const raw = await readImageData(file);
  if (raw.length <= 700000 || !window.createImageBitmap) return raw;
  try {
    const bitmap = await createImageBitmap(file), scale = Math.min(1, 1280 / Math.max(bitmap.width, bitmap.height));
    const canvas = document.createElement('canvas'); canvas.width = Math.max(1, Math.round(bitmap.width * scale)); canvas.height = Math.max(1, Math.round(bitmap.height * scale));
    canvas.getContext('2d').drawImage(bitmap, 0, 0, canvas.width, canvas.height);
    const compressed = canvas.toDataURL('image/jpeg', .82); if (bitmap.close) bitmap.close(); return compressed.length < raw.length ? compressed : raw;
  } catch (e) { return raw; }
}
async function barcodeFromImage(file) {
  if (!('BarcodeDetector' in window) || !window.createImageBitmap) return '';
  try {
    const bitmap = await createImageBitmap(file), detector = new BarcodeDetector({formats: barcodeFormats}), rows = await detector.detect(bitmap); if (bitmap.close) bitmap.close();
    return rows && rows[0] && rows[0].rawValue ? String(rows[0].rawValue).trim() : '';
  } catch (e) { return ''; }
}
function findScannedProduct(value) {
  const query = String(value || '').trim().toLowerCase(); if (!query) return null;
  return allProducts().find(p => String(p.sku || '').toLowerCase() === query) || allProducts().find(p => String(p.name || '').toLowerCase() === query) || null;
}
function scanProductImage(options) {
  const input = document.createElement('input'); input.type = 'file'; input.accept = 'image/*'; input.setAttribute('capture', 'environment'); input.style.display = 'none'; document.body.appendChild(input);
  input.onchange = async () => {
    const file = input.files && input.files[0]; input.remove(); if (!file) return;
    if (!/^image\//.test(file.type || '')) { toast('Choose a product image or barcode photo.', true); return; }
    if (file.size > 8 * 1024 * 1024) { toast('Choose an image smaller than 8 MB.', true); return; }
    toast('Scanning product image…');
    const barcode = await barcodeFromImage(file), local = findScannedProduct(barcode);
    let imageData = '', recognized = null;
    try { imageData = await compactImageData(file); } catch (e) {}
    if (navigator.onLine && S.api && imageData) {
      try { recognized = await call('recognizeProductImage', {imageData, filename: file.name || 'product-image.jpg', barcode}, 30000); } catch (e) { /* The manual and local-barcode paths remain available when the optional recognition service is not deployed. */ }
    }
    const candidate = recognized && (recognized.product || recognized), suggested = findScannedProduct(candidate && (candidate.sku || candidate.barcode || candidate.code)) || local;
    if (suggested) { options.onMatch && options.onMatch(suggested, {file, imageData, barcode, recognized}); return; }
    if (recognized && options.onRecognized) { options.onRecognized(recognized, {file, imageData, barcode}); return; }
    if (barcode && options.onBarcode) { options.onBarcode(barcode, {file, imageData}); return; }
    toast('No matching product was found. You can still search or enter it manually.', true);
  };
  input.click();
}

function receipt(e, lines) {
  const s = S.snap, rows = lines.map(l => { const p = prod(l.sku), pr = linePrice(l); return `<tr><td colspan="3">${esc(p.name)}</td></tr><tr><td>${qty(l.qty)} × ${money(pr)}</td><td></td><td class="num">${money(l.qty * pr)}</td></tr>`; }).join('');
  const html = `<div style="text-align:center"><b>${esc(s.company)}</b><br>${esc(e.docNo)}<br>${esc(e.date)} · ${esc(S.auth.user.fullName || S.auth.user.username)}<br>Customer: ${esc(e._label)}</div><hr><table>${rows}</table><hr>
  <table><tr><td>Total</td><td class="num"><b>${money(e._total)}</b></td></tr>${e.amountTendered > e.amountPaid ? `<tr><td>Tendered (${esc(e.method)})</td><td class="num">${money(e.amountTendered)}</td></tr>` : ''}<tr><td>Paid (${esc(e.method)})</td><td class="num">${money(e.amountPaid)}</td></tr>${e.changeDue ? `<tr><td>Change due</td><td class="num"><b>${money(e.changeDue)}</b></td></tr>` : ''}${e.amountPaid < e._total ? `<tr><td>Balance owing</td><td class="num"><b>${money(e._total - e.amountPaid)}</b></td></tr>` : ''}</table><hr><div style="text-align:center">${esc(s.footer || '')}</div>`;

  document.body.appendChild(o); $('#pr', o).onclick = () => window.print(); $('#ok', o).onclick = () => { o.remove(); S.screen = 'sale'; render(); };

    }
    S.api = next; LSset('api', S.api);
    if (nextKey !== SUPABASE_PUBLISHABLE_KEY) { SUPABASE_PUBLISHABLE_KEY = nextKey; LSset('supabase_key', nextKey); }
    toast('Saved');
  };
  $('#cp').onclick = async () => { const oldPin = $('#p0').value, newPin = $('#p1').value; try { await call('changePin', {oldPin, newPin}); const salt = uid(); S.lock = {salt, hash: await lockHash(salt, newPin)}; LSset('lock', S.lock); toast('PIN changed'); render(); } catch (e) { toast(e.message, true); } };
  $('#bk').onclick = () => { const blob = new Blob([JSON.stringify({exportedAt: new Date().toISOString(), user: S.auth.user, queue: S.queue, failed: S.failed, syncIssue: S.syncIssue, history: S.hist.slice(0, 100)}, null, 1)], {type: 'application/json'}); const a = document.createElement('a'), url = URL.createObjectURL(blob); a.href = url; a.download = 'cashbook-backup-' + todayStr() + '.json'; a.click(); setTimeout(() => URL.revokeObjectURL(url), 1000); };
  $('#lo').onclick = async () => { if (unresolved && !confirm('You still have ' + unresolved + ' action' + (unresolved === 1 ? '' : 's') + ' waiting or needing attention. Signing out keeps them on this PC, but only YOU can post or resolve them. Sign out anyway?')) return;
    try { await call('logout', {}, 8000); } catch (e) {} persist(); S.auth = null; S.lock = null; S.unlocked = false; LSset('auth', null); LSset('lock', null); loadMine(); render(); };
}

if ('serviceWorker' in navigator && /^https?:/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});
window.addEventListener('beforeunload', e => { if ((S.queue.length || S.failed.length) && S.unlocked) { e.preventDefault(); e.returnValue = ''; } });
if (S.auth && !S.lock) S.unlocked = true;
render();
})();
</script>
