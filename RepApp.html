<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2b2b2b">
<link rel="manifest" href="manifest.json">
<title>Cashbook — Sales</title>
<style>
:root{--ink:#2b2b2b;--ink2:#626262;--paper:#f4f4f2;--line:#dddcd8;--accent:#e8751a;--accent-dark:#c95c0b;--green:#087451;--greenbg:#e4f4ec;--red:#b3261e;--redbg:#fbe9e7;--amber:#875800;--amberbg:#fdf1d6}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
h1,h2,h3{font-family:inherit;margin:0 0 .5rem}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:8px;padding:.6rem 1rem;min-height:44px;font-weight:600}
button:hover:not(:disabled){background:var(--accent-dark);border-color:var(--accent-dark)}
button.ghost{background:#fff;color:var(--ink);border-color:var(--line)}button.danger{background:var(--red);border-color:var(--red)}button.sm{min-height:34px;padding:.25rem .7rem;font-size:.9rem}
button:disabled{opacity:.5}
:focus-visible{outline:3px solid #f5ad70;outline-offset:1px}
input,select,textarea{width:100%;padding:.6rem .7rem;border:1px solid var(--line);border-radius:8px;background:#fff;min-height:44px}
label{display:block;font-size:.88rem;color:var(--ink2);margin-bottom:.2rem}
header{background:var(--ink);color:#fff;padding:.6rem 1rem;display:flex;gap:.8rem;align-items:center;flex-wrap:wrap}
header .co{font:700 1.1rem inherit;flex:1}
.pill{padding:.2rem .7rem;border-radius:99px;font-size:.85rem;background:#4b4b4b;color:#fff}.pill.on{background:var(--green)}.pill.warn{background:#a86b00}
nav{display:flex;gap:.3rem;overflow:auto;padding:.5rem .7rem;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
nav button{background:transparent;color:var(--ink);border:0;white-space:nowrap;min-height:40px}nav button.on,nav button.on:hover{background:var(--ink);border-color:var(--ink);color:#fff}
main{max-width:980px;margin:0 auto;padding:1rem}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:1rem;margin-bottom:1rem}
.grid{display:grid;gap:.8rem;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:end}.row>*{flex:1 1 150px}.row>.fit{flex:0 0 auto}
.big{font:700 1.7rem inherit;font-variant-numeric:tabular-nums}
.muted,.hint{color:var(--ink2);font-size:.9rem}.neg{color:var(--red)}.pos{color:var(--green)}
  table{border-collapse:collapse;width:100%}th,td{padding:.45rem .5rem;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}th{font-size:.82rem;color:var(--ink2)}.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tag{display:inline-block;padding:.05rem .5rem;border-radius:99px;font-size:.78rem;background:var(--amberbg);color:var(--amber)}.tag.g{background:var(--greenbg);color:var(--green)}.tag.r{background:var(--redbg);color:var(--red)}
.banner{padding:.7rem 1rem;border-radius:8px;margin-bottom:1rem;background:var(--amberbg);color:#5a3b00}.banner.r{background:var(--redbg);color:#7a1610}
  .hit{display:flex;justify-content:space-between;gap:1rem;width:100%;text-align:left;background:#fff;color:var(--ink);border:1px solid var(--line);margin-top:.3rem}.hit:disabled{opacity:.65;cursor:not-allowed}
  table.sale-lines{min-width:760px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin-top:.7rem;padding-top:.7rem;border-top:1px solid var(--line)}.stats b{display:block;font:700 1.1rem inherit;font-variant-numeric:tabular-nums}.stats span{font-size:.82rem;color:var(--ink2)}.stats .spent b{color:var(--red)}
.total{font:700 1.5rem inherit;font-variant-numeric:tabular-nums}
.center{min-height:100vh;display:grid;place-items:center;padding:1rem}.center .card{width:100%;max-width:400px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:1rem;z-index:99;display:flex;flex-direction:column;gap:.4rem;align-items:center}
#toast div{background:var(--ink);color:#fff;padding:.7rem 1.1rem;border-radius:8px}#toast .err{background:var(--red)}
.overlay{position:fixed;inset:0;background:#0007;display:flex;justify-content:center;align-items:flex-start;padding:4vh 1rem;overflow:auto;z-index:40}.modal{background:#fff;border-radius:12px;padding:1.2rem;width:100%;max-width:460px}
#receipt{display:none}
  @media(max-width:600px){body{font-size:15px}header{padding:.55rem .7rem;gap:.45rem}header .co{flex-basis:100%}main{padding:.7rem}.card{padding:.8rem}.grid{grid-template-columns:1fr}.row{display:grid;grid-template-columns:minmax(0,1fr);gap:.65rem;align-items:stretch}.row>*{min-width:0}.row>.fit{width:100%}.row>.fit button{width:100%}.hit{gap:.5rem;padding:.55rem .65rem;align-items:center}.scroll>table{min-width:520px}.scroll>table.sale-lines{min-width:760px}.modal{padding:1rem}.stats{grid-template-columns:1fr 1fr}.total{font-size:1.3rem}}
  @media print{body>*{display:none!important}#receipt{display:block!important;width:78mm;margin:0;font:12px/1.35 monospace;color:#000}#receipt table td,#receipt table th{border:0;padding:1px 0}}
</style>
</head>
<body>
<div id="app"></div><div id="toast"></div><div id="receipt"></div>
<script>
/* ============================================================
   >>> OWNER: paste your web app link between the quotes below once, before copying this file to the reps' PCs.
   ============================================================ */
const DEFAULT_API_URL = '';

(function () {
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// What belongs to the PC (server link, sign-in, PIN lock) is stored once. Everything a person produces (waiting entries, history,
// price list, counters, half-filled forms) is stored under that person's own name, so nobody ever sees another person's work.
let WHO = '';
const SCOPED = ['queue', 'failed', 'syncIssue', 'hist', 'snap', 'lastSync', 'docseq', 'newseq', 'epoch', 'drafts'];
const skey = k => 'cb_' + (SCOPED.indexOf(k) >= 0 ? 'u_' + WHO + '_' : '') + k;
const LSget = (k, d) => { try { const v = localStorage.getItem(skey(k)); return v == null ? d : JSON.parse(v); } catch (e) { return d; } };
let storageWarningAt = 0;
const storageWarning = () => { const now = Date.now(); if (now - storageWarningAt > 5000) toast('This browser cannot store data. Do not close the app and tell your manager.', true); storageWarningAt = now; };
const LSset = (k, v) => { try { localStorage.setItem(skey(k), JSON.stringify(v)); return true; } catch (e) { storageWarning(); return false; } };
const whoOf = a => a && a.user && a.user.username ? String(a.user.username).toLowerCase().replace(/[^a-z0-9._-]/g, '') : '';
const uid = () => crypto.randomUUID ? crypto.randomUUID() : 'id-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
const pad = (n, l = 2) => String(n).padStart(l, '0');
const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
const weekStartStr = () => { const d = new Date(); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };

try { const q = new URLSearchParams(location.search).get('api'); if (q && /^https:\/\/script\.google(usercontent)?\.com\//.test(q)) { localStorage.setItem('cb_api', JSON.stringify(q)); history.replaceState(null, '', location.pathname); } } catch (e) {}
const S = {
  api: LSget('api', '') || DEFAULT_API_URL, auth: LSget('auth', null), lock: LSget('lock', null), snap: null, queue: [], failed: [], syncIssue: null, hist: [], lastSync: null, epoch: null,
  unlocked: false, needLogin: false, syncing: false, screen: 'home', unlockFails: 0
};
function loadMine() { WHO = whoOf(S.auth); S.snap = WHO ? LSget('snap', null) : null; S.queue = WHO ? LSget('queue', []) : []; S.failed = WHO ? LSget('failed', []) : []; S.syncIssue = WHO ? LSget('syncIssue', null) : null; S.hist = WHO ? LSget('hist', []) : []; S.lastSync = WHO ? LSget('lastSync', null) : null; S.epoch = WHO ? LSget('epoch', null) : null; DRAFT = WHO ? LSget('drafts', {}) : {}; if (!Array.isArray(S.queue)) S.queue = []; if (!Array.isArray(S.failed)) S.failed = []; }
let DRAFT = {};
(function migrateOldStorage() {            // version 1.1 kept everything in shared keys: hand it to whoever is signed in
  try { const u = whoOf(S.auth); if (!u) return;
    ['queue', 'hist', 'snap', 'lastSync', 'docseq', 'newseq'].forEach(k => { const old = localStorage.getItem('cb_' + k); if (old != null) { if (localStorage.getItem('cb_u_' + u + '_' + k) == null) localStorage.setItem('cb_u_' + u + '_' + k, old); localStorage.removeItem('cb_' + k); } });
  } catch (e) {}
})();
loadMine();
const persist = () => {
  // The pending queue is the durable source for a newly saved action. Return
  // only that write's result so a non-critical cache write cannot falsely tell
  // the user that their already-stored action was lost.
  const queueSaved = LSset('queue', S.queue);
  LSset('failed', S.failed); LSset('syncIssue', S.syncIssue); LSset('hist', S.hist);
  LSset('snap', S.snap); LSset('lastSync', S.lastSync); LSset('epoch', S.epoch); LSset('auth', S.auth);
  return queueSaved;
};
const cur = () => (S.snap && S.snap.currency) || '₦';
const money = n => cur() + Number(n || 0).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
const qty = n => Number(n || 0).toLocaleString('en-US', {maximumFractionDigits: 4});
function toast(msg, err) { const t = document.createElement('div'); if (err) t.className = 'err'; t.textContent = msg; $('#toast').appendChild(t); setTimeout(() => t.remove(), err ? 6000 : 2800); }

/* ---------- local PIN lock (convenience lock for shared PCs; the real security is the server login) ---------- */
async function lockHash(salt, pin) {
  const data = salt + ':' + pin;
  if (window.crypto && crypto.subtle) { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(data)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join(''); }
  let h = 5381; for (let i = 0; i < data.length; i++) h = ((h << 5) + h + data.charCodeAt(i)) | 0; return 'x' + h;
}

/* ---------- server calls ---------- */
async function call(action, data, ms) {
  if (!S.api) throw {code: 'CONFIG', message: 'The server link is not set. Open Settings and paste it, or ask your manager.'};
  const ctrl = new AbortController(), t = setTimeout(() => ctrl.abort(), ms || 30000);
  try {
    const res = await fetch(S.api, {method: 'POST', headers: {'Content-Type': 'text/plain;charset=utf-8'}, redirect: 'follow', signal: ctrl.signal,
      body: JSON.stringify(Object.assign({action, token: S.auth && S.auth.token}, data || {}))});
    const j = await res.json();
    if (!j.ok) throw {code: j.code || 'SERVER', message: j.error || 'Server error'};
    return j.data;
  } catch (e) { if (e && e.code) throw e; throw {code: 'NET', message: 'Cannot reach the server (no internet?). Your entries are safe on this PC.'}; }
  finally { clearTimeout(t); }
}

async function sync(manual) {
  if (S.syncing || !S.auth) return;
  S.syncing = true; renderStatus();
  try {
    let guard = 0;
    do {
      const batch = S.queue.slice(0, 40);
      const data = await call('sync', {epoch: S.epoch || undefined, entries: batch.map(e => { const c = {}; Object.keys(e).forEach(k => { if (k[0] !== '_') c[k] = e[k]; }); return c; })});
      if (data.epochChanged) { handleReset(data.snapshot); break; }
      const done = {}; data.results.forEach(r => done[r.clientId] = r); const at = new Date().toISOString();
      batch.forEach(e => { const r = done[e.clientId]; if (!r) return; recordSyncResult(e, r, at); });
      S.queue = S.queue.filter(e => !done[e.clientId]); S.hist = S.hist.slice(0, 300);
      S.snap = data.snapshot; S.epoch = data.snapshot.epoch || S.epoch; S.lastSync = at; S.syncIssue = null; persist();
      if (!Object.keys(done).length) break;
    } while (S.queue.length && ++guard < 30);
    S.needLogin = false;
    if (manual) toast(failed() ? failed() + ' action' + (failed() === 1 ? ' needs' : 's need') + ' attention in Sync centre.' : 'Synced', !!failed());
  } catch (e) { if (e.code === 'AUTH') S.needLogin = true; S.syncIssue = {kind: e.code === 'AUTH' ? 'AUTH' : 'TRANSPORT', code: e.code || 'NET', message: e.message || 'Could not reach the server.', at: new Date().toISOString()}; persist(); if (manual || e.code === 'AUTH') toast(e.message, true); }
  S.syncing = false; softRefresh();
}
// Keep a server-rejected action intact on this device. It is intentionally not
// retried automatically: validation/permission errors need a person to decide
// when a retry is appropriate. The original clientId remains unchanged, so an
// explicit retry is idempotent if the server actually completed it first.
function recordSyncResult(e, r, at) {
  const rejected = r.status === 'ERROR' || r.status === 'REJECTED';
  const summary = {clientId: e.clientId, type: e.type, label: e._label, amount: e._total, date: e.date, docNo: r.docNo || e.docNo, status: rejected ? 'REJECTED' : 'SYNCED', message: r.message || '', flags: r.flags || [], at, seen: !rejected};
  const oldHistory = S.hist.findIndex(h => h.clientId === e.clientId);
  if (oldHistory >= 0) S.hist[oldHistory] = Object.assign({}, S.hist[oldHistory], summary); else S.hist.unshift(summary);
  const previous = S.failed.find(x => x.entry && x.entry.clientId === e.clientId);
  S.failed = S.failed.filter(x => !x.entry || x.entry.clientId !== e.clientId);
  if (rejected) S.failed.unshift({entry: JSON.parse(JSON.stringify(e)), message: summary.message || 'The server rejected this action.', at, attempts: (previous ? +previous.attempts || 0 : 0) + 1});
}
// The office wiped its data (factory reset). Entries still waiting here belong to the old books, so they are saved to a file and cleared.
function handleReset(snap) {
  const n = S.queue.length + S.failed.length;
  if (n) { const blob = new Blob([JSON.stringify({note: 'Actions held on this device when the office reset its data', savedAt: new Date().toISOString(), user: S.auth.user, entries: S.queue, failed: S.failed, syncIssue: S.syncIssue}, null, 1)], {type: 'application/json'}); const a = document.createElement('a'), url = URL.createObjectURL(blob); a.href = url; a.download = 'cashbook-before-reset-' + todayStr() + '.json'; a.click(); setTimeout(() => URL.revokeObjectURL(url), 1000); }
  S.queue = []; S.failed = []; S.syncIssue = null; S.hist = []; S.snap = snap; S.epoch = snap.epoch; S.lastSync = new Date().toISOString(); persist();
  alert('The office has reset its records, so this app was refreshed.' + (n ? '\n\n' + n + ' action' + (n > 1 ? 's were' : ' was') + ' saved to a file in your Downloads folder and removed. Give the file to your manager.' : ''));
}
const REFRESH_MS = 120000;   // while the app is open and online: send waiting entries and refresh prices, stock and totals about every 2 minutes
setInterval(() => { if (navigator.onLine && S.auth && !S.needLogin && S.unlocked && !document.hidden && (S.queue.length || !S.lastSync || Date.now() - Date.parse(S.lastSync) > REFRESH_MS - 5000)) sync(false); }, 30000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && navigator.onLine && S.auth && S.unlocked && !S.needLogin && (!S.lastSync || Date.now() - Date.parse(S.lastSync) > 30000)) sync(false); });
window.addEventListener('online', () => { if (S.auth && S.unlocked) sync(false); });
window.addEventListener('offline', renderStatus);

/* ---------- helpers on local data ---------- */
function allProducts() {
  const base = S.snap ? S.snap.products : [], have = {}; base.forEach(p => have[p.sku] = true);
  const local = S.queue.filter(e => e.type === 'ADD_PRODUCT' && !have[e.sku]).map(e => ({sku: e.sku, name: e.name, category: e.category, unit: e.unit, price: e.price, cost: 0, type: e.kind, editable: e.kind === 'SERVICE' && !!e.priceEditable, costReady: false, stock: e.kind === 'SERVICE' ? null : 0, _local: true}));
  return base.concat(local);
}
const prod = sku => allProducts().find(p => p.sku === sku);
const isSvc = p => p && p.type === 'SERVICE';
  const costReady = p => !!p && p.costReady === true;
const can = k => !!(S.snap && S.snap.permissions && S.snap.permissions.indexOf(k) >= 0);
const pending = () => S.queue.length;
const failed = () => S.failed.length;
function avail(sku) { const p = prod(sku); if (!p || isSvc(p)) return null; let q = p.stock || 0; S.queue.forEach(e => { if (e.type === 'SALE') e.items.forEach(i => { if (i.sku === sku) q -= i.qty; }); else if (e.type === 'STOCK_IN') e.items.forEach(i => { if (i.sku === sku) q += i.qty; }); }); return q; }
function custBalance(c) { let b = c.balance; S.queue.forEach(e => { if (e.partyId !== c.id) return; if (e.type === 'SALE') b += e._total - (e.amountPaid ?? e._total); else if (e.type === 'PAYMENT_IN') b -= e.amount; }); return b; }
function totalsFor(from) { const t = S.snap ? S.snap.totals : null; const o = {invoices: 0, qty: 0, revenue: 0, expenses: 0};
  const base = t ? (from === 'today' ? t.today : from === 'week' ? t.week : t.month) : o; Object.assign(o, base);
  const f = from === 'today' ? todayStr() : from === 'week' ? weekStartStr() : todayStr().slice(0, 8) + '01';
  S.queue.forEach(e => { if (e.date < f) return; if (e.type === 'SALE') { o.invoices++; o.qty += e._qty; o.revenue += e._total; } else if (e.type === 'EXPENSE') o.expenses += e.amount; }); return o; }
function nextDocNo() { const d = todayStr(), c = LSget('docseq', {d: '', n: 0}); const n = c.d === d ? c.n + 1 : 1; LSset('docseq', {d, n});
  const pre = (S.auth.user.username.replace(/[^A-Za-z0-9]/g, '').slice(0, 4) || 'REP').toUpperCase(); return `${pre}-${d.slice(2, 4)}${d.slice(5, 7)}${d.slice(8, 10)}-${pad(n, 3)}`; }
function enqueue(entry) {
  entry.clientId = uid(); entry.date = todayStr(); entry.at = new Date().toISOString(); entry._user = S.auth.user.username;
  S.queue.push(entry);
  // Do not call an action saved until it has reached durable browser storage.
  // Restore the in-memory queue if storage failed, so it cannot look saved when
  // it would disappear on reload.
  if (!persist()) { S.queue = S.queue.filter(e => e !== entry); toast('This action was not saved. Free browser storage or use another device before trying again.', true); return null; }
  setTimeout(() => { if (navigator.onLine) sync(false); }, 300);
  return entry;
}
function retryFailed(ids) {
  const wanted = new Set((Array.isArray(ids) ? ids : [ids]).filter(Boolean));
  const selected = S.failed.filter(x => x.entry && wanted.has(x.entry.clientId));
  if (!selected.length) return;
  // Put retrying actions before newer entries, preserving their original order.
  selected.sort((a, b) => String(a.entry.at || '').localeCompare(String(b.entry.at || '')));
  S.failed = S.failed.filter(x => !x.entry || !wanted.has(x.entry.clientId));
  S.queue = selected.map(x => Object.assign({}, x.entry)).concat(S.queue);
  S.syncIssue = null; persist();
  toast(selected.length === 1 ? 'Moved the failed action back to Pending sync.' : selected.length + ' failed actions moved back to Pending sync.');
  softRefresh();
  if (navigator.onLine) sync(false);
}

/* ---------- screens ---------- */
const tabs = () => [['home', 'Home'], ['sale', 'New sale'], ['pay', 'Customer payment'], ['exp', 'Expense']].concat(can('STOCK_IN') ? [['stockin', 'Receive stock']] : [], can('ADD_PRODUCT') ? [['newp', 'Add item / service']] : [], [['stock', 'Stock & prices'], ['cust', 'Customers'], ['sync', 'Sync centre'], ['hist', 'My entries'], ['set', 'Settings']]);
function render() {
  const app = $('#app');
  if (!S.auth) return loginScreen(app);
  if (S.lock && !S.unlocked) return unlockScreen(app);
  app.innerHTML = `<header><div class="co">${esc(S.snap ? S.snap.company : 'Cashbook')}${S.snap && S.snap.locationName && S.snap.locationName !== 'Main shop' ? ' · ' + esc(S.snap.locationName) : ''}</div><span id="who" class="pill">${esc(S.auth.user.fullName || S.auth.user.username)}</span><span id="st" class="pill"></span><button class="ghost sm" id="syncnow">Sync now</button></header>
  <nav id="nav"></nav><main id="main"><div id="banners"></div><div id="body"></div></main>`;
  $('#syncnow').onclick = () => sync(true); renderNav(); renderStatus(); renderBanners(); drawBody();
}
function renderNav() {
  const nav = $('#nav'); if (!nav) return;
  const waiting = pending() + failed();
  nav.innerHTML = tabs().map(t => `<button data-s="${t[0]}" class="${t[0] === S.screen ? 'on' : ''}">${t[1]}${t[0] === 'sync' && waiting ? ` (${waiting})` : ''}</button>`).join('');
  nav.querySelectorAll('[data-s]').forEach(b => b.onclick = () => { S.screen = b.dataset.s; renderNav(); drawBody(); });
}
function renderBanners() {
  const el = $('#banners'); if (!el) return; const rej = Math.max(failed(), S.hist.filter(h => h.status === 'REJECTED' && !h.seen).length);
  let top = '';
  if (S.needLogin) top += `<div class="banner r">Your login has expired. Your entries are safe on this PC. <button class="sm" id="relog">Sign in again</button></div>`;
  if (rej) top += `<div class="banner r">${rej} entr${rej > 1 ? 'ies need' : 'y needs'} attention. Open Sync centre to see the reason and retry only after it is corrected.</div>`;
  el.innerHTML = top;
  const rl = $('#relog'); if (rl) rl.onclick = () => { S.auth = Object.assign({}, S.auth, {token: null}); loginScreen($('#app'), true); };
}
function drawBody() {
  const body = $('#body'); if (!body) return;
  ({home, sale: saleScreen, pay: payScreen, exp: expScreen, stockin: stockInScreen, newp: newProductScreen, stock: stockScreen, cust: custScreen, sync: syncScreen, hist: histScreen, set: setScreen})[S.screen](body);
}
// After a background sync: update the badge, banners and only the screens that have nothing being typed into them.
// A form you are filling in (sale, payment, expense, receiving stock, new item) is never redrawn, so nothing you typed is lost.
function softRefresh() {
  if (!S.auth || (S.lock && !S.unlocked) || !$('#body')) { render(); return; }
  renderStatus(); renderBanners(); renderNav();
  const co = $('.co'); if (co && S.snap) co.textContent = S.snap.company + (S.snap.locationName && S.snap.locationName !== 'Main shop' ? ' · ' + S.snap.locationName : '');
  if (['home', 'sync', 'hist', 'stock', 'cust'].indexOf(S.screen) < 0) return;
  const q = $('#q'), keep = q ? {v: q.value, focus: document.activeElement === q, pos: q.selectionStart} : null;
  drawBody();

  const items = () => allProducts().filter(p => !isSvc(p));
  m.innerHTML = `<h2>Receive stock</h2><div class="card"><p class="muted">Use this when new goods arrive. The cost you enter is checked by the owner. Stock goes up in <b>${esc(S.snap.locationName || 'your shop')}</b> straight away and the office is updated when you sync.</p>
  <div class="row"><div><label>Supplier</label><select id="si-sup"><option value="">Cash purchase (no supplier)</option>${(S.snap.suppliers || []).map(x => `<option value="${esc(x.id)}">${esc(x.name)}</option>`).join('')}<option value="new">+ New supplier</option></select></div><div id="si-newc" style="display:none"><label>New supplier name</label><input id="si-nn"></div></div>
  <div style="margin-top:1rem"><label>Find a product (name, code, or scan)</label><input id="si-ps" autocomplete="off" placeholder="Type or scan…"><div id="si-hits"></div></div></div>
  <div class="card"><div id="si-cart"></div><div class="row" style="margin-top:1rem"><div><label>Amount paid now</label><input id="si-paid" type="number" step="any" min="0" placeholder="Leave empty = paid in full"><div class="hint" id="si-paid-help"></div></div><div><label>Payment method</label><select id="si-method">${S.snap.paymentMethods.map(x => `<option>${esc(x)}</option>`).join('')}</select></div><div><label>Note (optional)</label><input id="si-notes"></div></div>
  <div class="row" style="margin-top:1rem"><div><div class="total" id="si-tot"></div><div class="hint" id="si-summary"></div></div><div class="fit"><button class="ghost" id="si-clr">Clear</button></div><div class="fit"><button id="si-save">Save stock received</button></div></div></div>`;
  $('#si-sup').value = SIF.sup; $('#si-nn').value = SIF.nn; $('#si-paid').value = SIF.paid; $('#si-method').value = SIF.method; $('#si-notes').value = SIF.notes;
  const total = () => SI.reduce((t, c) => t + Math.round((c.qty * (+c.cost || 0)) * 100) / 100, 0);
  const sync_ = () => { SIF = {sup: $('#si-sup').value, nn: $('#si-nn').value, paid: $('#si-paid').value, method: $('#si-method').value, notes: $('#si-notes').value}; $('#si-newc').style.display = SIF.sup === 'new' ? '' : 'none'; const t = total(), hasSupplier = SIF.sup !== '', paidEl = $('#si-paid'); paidEl.disabled = !hasSupplier; if (!hasSupplier) { paidEl.value = ''; SIF.paid = ''; $('#si-paid-help').textContent = 'Cash purchase: paid in full. Choose or add a supplier to record a part payment.'; } else $('#si-paid-help').textContent = 'Leave blank for paid in full, or enter what was paid now.'; const raw = SIF.paid === '' ? t : +SIF.paid, paid = Number.isFinite(raw) && raw >= 0 ? raw : 0, balance = Math.max(0, t - paid), tooMuch = paid > t; $('#si-tot').textContent = money(t); $('#si-summary').innerHTML = tooMuch ? '<b class="neg">Amount paid cannot be more than the purchase total.</b>' : `Paid now <b>${money(paid)}</b>${balance ? ` · Supplier balance <b class="neg">${money(balance)}</b>` : ''}`; };
  ['si-nn', 'si-paid', 'si-notes'].forEach(id => $('#' + id).addEventListener('input', sync_));
  ['si-sup', 'si-method'].forEach(id => $('#' + id).addEventListener('change', sync_));
  const draw = () => { $('#si-cart').innerHTML = SI.length ? `<table><thead><tr><th>Product</th><th class="num">Qty received</th><th class="num">Cost per unit</th><th class="num">Total</th><th></th></tr></thead><tbody>${SI.map((c, i) => { const p = prod(c.sku);
      return `<tr><td>${esc(p.name)}<div class="hint">${esc(p.sku)} · now ${qty(avail(p.sku))} ${esc(p.unit)}</div></td><td class="num"><input type="number" step="any" min="0" value="${c.qty}" data-q="${i}" style="width:90px;text-align:right"></td><td class="num"><input type="number" step="any" min="0" value="${c.cost}" data-c="${i}" style="width:110px;text-align:right"></td><td class="num" data-lt="${i}">${money(c.qty * (+c.cost || 0))}</td><td><button class="ghost sm" data-rm="${i}">✕</button></td></tr>`; }).join('')}</tbody></table>` : '<p class="muted">No products yet. Search above and tap a product to add it.</p>';
    const upd = k => { sync_(); const cell = $('#si-cart [data-lt="' + k + '"]'); if (cell) cell.textContent = money(SI[k].qty * (+SI[k].cost || 0)); };
    $('#si-cart').querySelectorAll('[data-q]').forEach(i => i.oninput = () => { SI[+i.dataset.q].qty = +i.value; upd(+i.dataset.q); });
    $('#si-cart').querySelectorAll('[data-c]').forEach(i => i.oninput = () => { SI[+i.dataset.c].cost = i.value; upd(+i.dataset.c); });
    $('#si-cart').querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { SI.splice(+b.dataset.rm, 1); draw(); }); sync_(); };
  const add = sku => { if (!SI.find(c => c.sku === sku)) SI.push({sku, qty: 1, cost: ''}); $('#si-ps').value = ''; $('#si-hits').innerHTML = ''; draw(); $('#si-ps').focus(); };
  $('#si-ps').oninput = e => { const t = e.target.value.trim().toLowerCase(); if (!t) { $('#si-hits').innerHTML = ''; return; }
    const r = items().filter(p => (p.sku + ' ' + p.name + ' ' + p.category).toLowerCase().includes(t)).slice(0, 8);
    $('#si-hits').innerHTML = r.map(p => `<button class="hit" data-a="${esc(p.sku)}"><span>${esc(p.name)} <span class="hint">${esc(p.sku)}</span></span><span>${qty(avail(p.sku))} in stock</span></button>`).join('') || '<p class="muted">No match. If it is a brand-new product, add it first under “Add item / service”.</p>';
    $('#si-hits').querySelectorAll('[data-a]').forEach(b => b.onclick = () => add(b.dataset.a)); };
  $('#si-ps').onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); const t = e.target.value.trim().toLowerCase(), ex = items().find(p => p.sku.toLowerCase() === t), first = $('#si-hits [data-a]'); if (ex) add(ex.sku); else if (first) add(first.dataset.a); } };
  $('#si-clr').onclick = () => { SI = []; SIF = {sup: '', nn: '', paid: '', method: 'Cash', notes: ''}; render(); };
  $('#si-save').onclick = () => {
    sync_(); if (!SI.length) return toast('Add at least one product.', true);
    if (SI.some(c => !(c.qty > 0))) return toast('Every quantity must be more than zero.', true);
    if (SI.some(c => c.cost === '' || !(+c.cost >= 0))) return toast('Enter the cost per unit for every product.', true);
    const t = total(), hasSup = SIF.sup !== '', rawPaid = SIF.paid === '' ? t : +SIF.paid;
    if (SIF.sup === 'new' && !SIF.nn.trim()) return toast('Enter the new supplier’s name.', true);
    if (!(rawPaid >= 0)) return toast('Enter a valid amount paid.', true);
    const paid = rawPaid;
    if (!hasSup && paid !== t) return toast('Cash purchases must be paid in full. Choose or add a supplier for a part payment.', true);
    if (paid > t) return toast('Amount paid cannot be more than the purchase total.', true);
    const sup = (S.snap.suppliers || []).find(x => x.id === SIF.sup);
    const e = {type: 'STOCK_IN', items: SI.map(c => ({sku: c.sku, qty: c.qty, unitCost: +c.cost})), amountPaid: paid, method: SIF.method, notes: SIF.notes, _label: !hasSup ? 'Cash purchase' : SIF.sup === 'new' ? SIF.nn.trim() : sup.name, _total: t, _qty: SI.reduce((x, c) => x + c.qty, 0)};
    if (SIF.sup === 'new') e.newParty = {name: SIF.nn.trim()}; else if (hasSup) e.partyId = SIF.sup;
    if (!enqueue(e)) return;
    SI = []; SIF = {sup: '', nn: '', paid: '', method: 'Cash', notes: ''}; toast('Stock saved. Waiting to sync.'); render();
  };
  draw();
}

function newProductScreen(m) {
  if (!can('ADD_PRODUCT')) { m.innerHTML = '<div class="card">You do not have permission to add items or services. Ask your manager.</div>'; return; }
  const cats = S.snap.categories || [];
  m.innerHTML = `<h2>Add an item or service</h2><div class="card"><p class="muted">Add the product, then ask the owner to set its cost. Sync again before selling it. You can receive stock if your account has permission.</p>
  <div class="row"><div><label>This is a</label><select id="np-kind"><option value="ITEM">Item (counted in stock)</option><option value="SERVICE">Service (printing, modelling… no stock)</option></select></div><div><label>Name</label><input id="np-name"></div></div>
  <div class="row" style="margin-top:.8rem"><div><label>Category</label><select id="np-cat">${cats.map(c => `<option>${esc(c)}</option>`).join('')}<option value="__new">+ New category…</option></select></div><div id="np-newcat-w" style="display:none"><label>New category</label><input id="np-newcat"></div><div><label>Unit (pc, sheet, print, hour, job…)</label><input id="np-unit" value="pc"></div></div>
  <div class="row" style="margin:.8rem 0"><div><label>Selling price</label><input id="np-price" type="number" step="any" min="0"></div><div id="np-re-w"><label>Alert me when stock is at or below</label><input id="np-re" type="number" step="any" min="0" value="0"></div><div id="np-pe-w" style="display:none"><label><input type="checkbox" id="np-pe" style="width:auto;min-height:0"> Price is quoted per job</label></div></div>
  <button id="np-save">Save</button></div>`;
  const sync_ = () => { const svc = $('#np-kind').value === 'SERVICE'; $('#np-re-w').style.display = svc ? 'none' : ''; $('#np-pe-w').style.display = svc ? '' : 'none'; $('#np-newcat-w').style.display = $('#np-cat').value === '__new' || !cats.length ? '' : 'none'; if ($('#np-unit').value === 'pc' && svc) $('#np-unit').value = 'job'; else if ($('#np-unit').value === 'job' && !svc) $('#np-unit').value = 'pc'; };
  bindDraft('newp', ['np-kind', 'np-name', 'np-cat', 'np-newcat', 'np-unit', 'np-price', 're-placeholder'].filter(x => x !== 're-placeholder').concat(['np-re'])); ['np-kind', 'np-cat'].forEach(id => $('#' + id).addEventListener('input', sync_)); sync_();
  $('#np-save').onclick = () => {
    const name = $('#np-name').value.trim(), cat = ($('#np-cat').value === '__new' || !cats.length) ? $('#np-newcat').value.trim() : $('#np-cat').value, price = +$('#np-price').value;
    if (!name) return toast('Enter a name.', true); if (!cat) return toast('Choose or type a category.', true); if (!($('#np-price').value !== '' && price >= 0)) return toast('Enter the selling price.', true);
    if (allProducts().some(p => p.name.trim().toLowerCase() === name.toLowerCase()) && !confirm('Something called “' + name + '” already exists. Add another one anyway?')) return;
    const c = LSget('newseq', 0) + 1; LSset('newseq', c);
    const pre = (S.auth.user.username.replace(/[^A-Za-z0-9]/g, '').slice(0, 4) || 'REP').toUpperCase(), kind = $('#np-kind').value;
    // One queued entry is enough: its clientId makes an offline retry safe,
    // and keeps the new item ahead of a following stock receipt in the queue.
    if (!enqueue({type: 'ADD_PRODUCT', sku: `NEW-${pre}-${pad(c, 3)}`, name, category: cat, unit: $('#np-unit').value.trim(), price,
      reorder: kind === 'ITEM' ? +$('#np-re').value : 0, kind, priceEditable: kind === 'SERVICE' && $('#np-pe').checked,
      _label: name, _total: price})) return;
    clearDraft('newp'); toast('Saved. You can use it now.'); S.screen = kind === 'SERVICE' ? 'sale' : 'stockin'; if (!can('STOCK_IN') && kind === 'ITEM') S.screen = 'stock'; renderNav(); drawBody();
  };
}

function stockScreen(m) {
  m.innerHTML = `<h2>Stock & prices</h2><div class="card"><input id="q" placeholder="Search products…"><p class="hint">Quantities are as of the last sync, less sales waiting on this PC.</p><div id="t"></div></div>`;
  const draw = () => { const t = $('#q').value.toLowerCase(), r = allProducts().filter(p => (p.sku + p.name + p.category).toLowerCase().includes(t));
    $('#t').innerHTML = `<table><thead><tr><th>Product</th><th class="num">Price</th><th class="num">Available</th></tr></thead><tbody>${r.map(p => { const a = avail(p.sku); return `<tr><td>${esc(p.name)}${isSvc(p) ? ' <span class="tag g">service</span>' : ''}${p._local ? ' <span class="tag">new, not synced</span>' : ''}<div class="hint">${esc(p.sku)} · ${esc(p.category)}</div></td><td class="num">${p.editable ? 'per job' : money(p.price)}</td><td class="num ${a !== null && a <= 0 ? 'neg' : ''}">${a === null ? '—' : qty(a) + ' ' + esc(p.unit)}</td></tr>`; }).join('') || '<tr><td colspan="3" class="muted">Nothing found.</td></tr>'}</tbody></table>`; };
  $('#q').oninput = draw; draw();
}
function custScreen(m) {
  m.innerHTML = `<h2>Customers</h2><div class="card"><input id="q" placeholder="Search customers…"><div id="t"></div></div>`;
  const draw = () => { const t = $('#q').value.toLowerCase(), r = (S.snap ? S.snap.customers : []).filter(c => (c.name + c.phone).toLowerCase().includes(t));
    $('#t').innerHTML = `<table><thead><tr><th>Customer</th><th class="num">Owes</th></tr></thead><tbody>${r.map(c => `<tr><td>${esc(c.name)}<div class="hint">${esc(c.phone)}</div></td><td class="num ${custBalance(c) > 0 ? 'neg' : ''}">${money(custBalance(c))}</td></tr>`).join('') || '<tr><td colspan="2" class="muted">Nobody yet.</td></tr>'}</tbody></table>`; };
  $('#q').oninput = draw; draw();
}
function syncScreen(m) {
  const labels = {SALE: 'Sale', EXPENSE: 'Expense', PAYMENT_IN: 'Customer payment', STOCK_IN: 'Stock received', ADD_PRODUCT: 'New item'};
  const action = e => labels[e.type] || e.type;
  const last = S.lastSync ? new Date(S.lastSync).toLocaleString() : 'Not yet synced';
  const issue = S.syncIssue;
  const issueText = !issue ? '' : issue.kind === 'AUTH'
    ? '<div class="banner r">Sign in again before this device can sync. Your pending actions are still stored here.</div>'
    : `<div class="banner">Last connection attempt: ${esc(issue.message)}<br><span class="hint">Your pending actions remain saved on this device and will be tried again when you tap Sync now or reconnect.</span></div>`;
  const pendingRows = S.queue.slice().reverse().map(e => `<tr><td>${esc(e.date)}</td><td><b>${esc(action(e))}</b>${e.docNo ? ' ' + esc(e.docNo) : ''}<div class="hint">${esc(e._label || '')}</div></td><td class="num">${money(e._total)}</td><td><span class="tag">Pending sync</span></td></tr>`).join('');
  const failedRows = S.failed.map(f => { const e = f.entry || {}; return `<tr><td>${esc(e.date || '')}</td><td><b>${esc(action(e))}</b>${e.docNo ? ' ' + esc(e.docNo) : ''}<div class="hint">${esc(e._label || '')}</div></td><td class="num">${money(e._total)}</td><td><div class="neg">${esc(f.message || 'The server rejected this action.')}</div><div class="hint">Attempt ${Math.max(1, +f.attempts || 0)} · ${f.at ? esc(new Date(f.at).toLocaleString()) : ''}</div></td><td class="num"><button class="ghost sm" data-retry="${esc(e.clientId || '')}" ${S.syncing ? 'disabled' : ''}>Retry</button></td></tr>`; }).join('');
  m.innerHTML = `<h2>Sync centre</h2><div class="card"><div class="row"><div><h3>${S.syncing ? 'Syncing…' : failed() ? 'Needs attention' : pending() ? 'Pending sync' : 'Saved'}</h3><p class="hint">Last server sync: ${esc(last)}.</p></div><div class="fit"><button id="sc-sync" ${S.syncing ? 'disabled' : ''}>${S.syncing ? 'Syncing…' : 'Sync now'}</button></div>${failed() ? '<div class="fit"><button class="ghost" id="sc-retry-all" ' + (S.syncing ? 'disabled' : '') + '>Retry all failed</button></div>' : ''}</div>${issueText}<p class="hint">Each sale, payment, expense, stock receipt and new product is first saved on this device. The app then sends it quietly in the background when it can.</p></div>
  <div class="card"><h3>Waiting to sync (${pending()})</h3>${pending() ? `<div class="scroll"><table><thead><tr><th>Date</th><th>Action</th><th class="num">Amount</th><th>Status</th></tr></thead><tbody>${pendingRows}</tbody></table></div>` : '<p class="pos">Nothing is waiting. This device is up to date.</p>'}</div>
  <div class="card"><h3>Failed actions (${failed()})</h3>${failed() ? `<p class="hint">These were rejected by the server, so they are not retried automatically. Correct the problem first, then retry the original action with the same safe reference.</p><div class="scroll"><table><thead><tr><th>Date</th><th>Action</th><th class="num">Amount</th><th>Reason</th><th></th></tr></thead><tbody>${failedRows}</tbody></table></div>` : '<p class="muted">No server-rejected actions on this device.</p>'}</div>`;
  const now = m.querySelector('#sc-sync'); if (now) now.onclick = () => sync(true);
  const retryAll = m.querySelector('#sc-retry-all'); if (retryAll) retryAll.onclick = () => retryFailed(S.failed.map(f => f.entry && f.entry.clientId));
  m.querySelectorAll('[data-retry]').forEach(b => b.onclick = () => retryFailed(b.dataset.retry));
}
function histScreen(m) {
  const lab = {SALE: 'Sale', EXPENSE: 'Expense', PAYMENT_IN: 'Payment', STOCK_IN: 'Stock received', ADD_PRODUCT: 'New item'};
  S.hist.forEach(h => { if (h.status === 'REJECTED') h.seen = true; }); LSset('hist', S.hist);
  m.innerHTML = `<h2>My entries</h2>${S.queue.length ? `<div class="card"><h3>Waiting to sync (${S.queue.length})</h3><table><tbody>${S.queue.slice().reverse().map(e => `<tr><td>${esc(e.date)}</td><td>${lab[e.type]}${e.docNo ? ' ' + esc(e.docNo) : ''}<div class="hint">${esc(e._label)}</div></td><td class="num">${money(e._total)}</td><td class="num"><button class="ghost sm" data-c="${esc(e.clientId)}">Cancel</button></td></tr>`).join('')}</tbody></table><p class="hint">You can cancel an entry only while it is still waiting. After it syncs, ask your manager to reverse it.</p></div>` : ''}
  <div class="card"><h3>Done</h3><table><tbody>${S.hist.slice(0, 100).map(h => `<tr><td>${esc(h.date)}</td><td>${lab[h.type] || h.type}${h.docNo ? ' ' + esc(h.docNo) : ''}<div class="hint">${esc(h.label)}</div>${h.status === 'REJECTED' ? `<div class="neg">${esc(h.message)}</div>` : ''}${(h.flags || []).length ? `<div class="hint">${esc(h.flags.join('; '))}</div>` : ''}</td><td class="num">${money(h.amount)}</td><td><span class="tag ${h.status === 'REJECTED' ? 'r' : 'g'}">${h.status === 'REJECTED' ? 'Rejected' : 'Synced'}</span></td></tr>`).join('') || '<tr><td class="muted">Nothing yet.</td></tr>'}</tbody></table></div>`;
  m.querySelectorAll('[data-c]').forEach(b => b.onclick = () => { if (confirm('Cancel this entry?')) { S.queue = S.queue.filter(e => e.clientId !== b.dataset.c); persist(); render(); } });
}
function setScreen(m) {
  const unresolved = pending() + failed();
  const signOutNote = failed()
    ? '<b class="neg">' + failed() + ' action' + (failed() === 1 ? ' needs' : 's need') + ' attention in Sync centre.</b>' + (pending() ? ' ' + pending() + ' entr' + (pending() === 1 ? 'y is' : 'ies are') + ' still waiting to sync.' : '')
    : pending() ? '<b class="neg">' + pending() + ' entries are still waiting to sync.</b> Connect to the internet and tap Sync now first.'
      : 'Everything is synced.';
  m.innerHTML = `<h2>Settings</h2><div class="card"><h3>Server link</h3><input id="api" value="${esc(S.api)}"><p style="margin-top:.6rem"><button class="ghost" id="sa">Save link</button></p></div>
  <div class="card"><h3>Change my PIN</h3><p class="hint">Needs internet.</p><div class="row"><div><label>Current PIN</label><input id="p0" type="password" inputmode="numeric"></div><div><label>New PIN (4+ digits)</label><input id="p1" type="password" inputmode="numeric"></div><div class="fit"><button id="cp">Change PIN</button></div></div></div>
  <div class="card"><h3>Safety copy</h3><p class="hint">Downloads all waiting and failed actions, plus recent sync history, in case this PC has a problem. Give the file to your manager.</p><button class="ghost" id="bk">Download backup file</button></div>
  <div class="card"><h3>Sign out</h3><p class="hint">${signOutNote}</p><button class="danger" id="lo">Sign out</button></div>
  <p class="hint">Cashbook rep app · ${esc(S.auth.user.username)} · device date ${todayStr()} (check it is correct)</p>`;
  $('#sa').onclick = () => { S.api = $('#api').value.trim(); LSset('api', S.api); toast('Saved'); };
  $('#cp').onclick = async () => { const oldPin = $('#p0').value, newPin = $('#p1').value; try { await call('changePin', {oldPin, newPin}); const salt = uid(); S.lock = {salt, hash: await lockHash(salt, newPin)}; LSset('lock', S.lock); toast('PIN changed'); render(); } catch (e) { toast(e.message, true); } };
  $('#bk').onclick = () => { const blob = new Blob([JSON.stringify({exportedAt: new Date().toISOString(), user: S.auth.user, queue: S.queue, failed: S.failed, syncIssue: S.syncIssue, history: S.hist.slice(0, 100)}, null, 1)], {type: 'application/json'}); const a = document.createElement('a'), url = URL.createObjectURL(blob); a.href = url; a.download = 'cashbook-backup-' + todayStr() + '.json'; a.click(); setTimeout(() => URL.revokeObjectURL(url), 1000); };
  $('#lo').onclick = async () => { if (unresolved && !confirm('You still have ' + unresolved + ' action' + (unresolved === 1 ? '' : 's') + ' waiting or needing attention. Signing out keeps them on this PC, but only YOU can post or resolve them. Sign out anyway?')) return;
    try { await call('logout', {}, 8000); } catch (e) {} persist(); S.auth = null; S.lock = null; S.unlocked = false; LSset('auth', null); LSset('lock', null); loadMine(); render(); };
}

if ('serviceWorker' in navigator && /^https?:/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});
window.addEventListener('beforeunload', e => { if ((S.queue.length || S.failed.length) && S.unlocked) { e.preventDefault(); e.returnValue = ''; } });
if (S.auth && !S.lock) S.unlocked = true;
render();
})();
</script>
</body>
</html>
