<script>
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let TOKEN = localStorage.getItem('cb_o_tok'), L = null, CUR = '₦', ME = null, VIEW = 'dashboard';
try { ME = JSON.parse(localStorage.getItem('cb_o_me') || 'null'); } catch (e) {}
const money = n => CUR + Number(n || 0).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
const qty = n => Number(n || 0).toLocaleString('en-US', {maximumFractionDigits: 4});
const cls = n => n < 0 ? 'neg' : '';
const uid = () => crypto.randomUUID ? crypto.randomUUID() : 'id' + Date.now() + Math.random().toString(36).slice(2);
const today = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };

/* ---- transport: inside Apps Script (google.script.run) or installed from GitHub (fetch) ---- */
const IN_SCRIPT = typeof google !== 'undefined' && google.script && google.script.run;
try { const q = new URLSearchParams(location.search).get('api'); if (q && /^https:\/\/script\.google(usercontent)?\.com\//.test(q)) { localStorage.setItem('cb_o_api', q); history.replaceState(null, '', location.pathname); } } catch (e) {}
let API_URL = localStorage.getItem('cb_o_api') || '';

/* ---- owner entry journal: save daily records on this browser before sending ----
   Ledger entries have a clientId and are deduplicated by the server, so it is
   safe to retry them after a lost connection or an interrupted response.
   Administrative changes stay online-only until they have the same durable
   idempotency contract. */
const OWNER_ENTRY_TYPES = new Set(['SALE', 'STOCK_IN', 'EXPENSE', 'PAYMENT_IN', 'PAYMENT_OUT', 'RETURN', 'OWNER_CONTRIBUTION', 'OWNER_WITHDRAWAL', 'ADJUSTMENT', 'TRANSFER', 'OPENING_BAL', 'REVERSAL']);
const OWNER_ENTRY_LABEL = {SALE: 'Sale', STOCK_IN: 'Stock received', EXPENSE: 'Expense', PAYMENT_IN: 'Customer payment', PAYMENT_OUT: 'Supplier payment', RETURN: 'Return / refund', OWNER_CONTRIBUTION: 'Owner contribution', OWNER_WITHDRAWAL: 'Owner withdrawal', ADJUSTMENT: 'Stock correction', TRANSFER: 'Stock transfer', OPENING_BAL: 'Opening balance', REVERSAL: 'Reversal'};
let OWNER_QUEUE = [], OWNER_SYNC_HISTORY = [], OWNER_SYNCING = false, OWNER_SYNC_TIMER = null, OWNER_SYNC_EPOCH = '', OWNER_SYNC_TOMBSTONES = {};
const ownerSyncUser = () => String((ME && (ME.username || ME.userId)) || 'signed-out').toLowerCase().replace(/[^a-z0-9._-]/g, '');
const ownerSyncKey = part => 'cb_o_' + ownerSyncUser() + '_' + part;
const ownerSyncCount = state => OWNER_QUEUE.filter(x => !state || x.state === state).length;
const ownerSyncLabel = item => OWNER_ENTRY_LABEL[item.type] || item.type || 'Saved action';
const ownerSyncEpoch = () => String(OWNER_SYNC_EPOCH || (L && L.epoch) || '');
const ownerSyncRead = (part, fallback) => { try { const raw = localStorage.getItem(ownerSyncKey(part)); return raw == null ? fallback : JSON.parse(raw); } catch (e) { return fallback; } };
const ownerItemTime = item => Date.parse(item && (item.updatedAt || item.failedAt || item.createdAt) || '') || 0;
const ownerStateRank = state => ({PENDING: 1, SYNCING: 2, FAILED: 3})[state] || 0;
function cleanOwnerTombstones(value) {
  const out = {}, cutoff = Date.now() - 30 * 24 * 60 * 60 * 1000;
  Object.keys(value && typeof value === 'object' ? value : {}).forEach(id => { const at = +value[id] || 0; if (id && at >= cutoff) out[id] = at; });
  return out;
}
function ownerNewerItem(a, b) {
  const ta = ownerItemTime(a), tb = ownerItemTime(b);
  if (ta !== tb) return ta > tb ? a : b;
  return ownerStateRank(a && a.state) >= ownerStateRank(b && b.state) ? a : b;
}
function mergeOwnerBrowserQueue() {
  const diskQueue = ownerSyncRead('entry_queue', []), diskTombstones = cleanOwnerTombstones(ownerSyncRead('entry_tombstones', {}));
  OWNER_SYNC_TOMBSTONES = cleanOwnerTombstones(Object.assign({}, diskTombstones, OWNER_SYNC_TOMBSTONES));
  const merged = {};
  (Array.isArray(diskQueue) ? diskQueue : []).concat(OWNER_QUEUE).forEach(item => {
    if (!item || !item.clientId || !item.entry) return;
    merged[item.clientId] = merged[item.clientId] ? ownerNewerItem(merged[item.clientId], item) : item;
  });
  Object.keys(OWNER_SYNC_TOMBSTONES).forEach(id => delete merged[id]);
  OWNER_QUEUE = Object.keys(merged).map(id => merged[id]).sort((a, b) => ownerItemTime(a) - ownerItemTime(b));
}
function markOwnerRemoved(items) {
  (Array.isArray(items) ? items : [items]).forEach(item => { const id = typeof item === 'string' ? item : item && item.clientId; if (id) OWNER_SYNC_TOMBSTONES[id] = Date.now(); });
  OWNER_SYNC_TOMBSTONES = cleanOwnerTombstones(OWNER_SYNC_TOMBSTONES);
}
function ownerEntryMatchesCurrentBooks(item) {
  const current = ownerSyncEpoch(), itemEpoch = String(item && item.epoch || '');
  return !current || !itemEpoch || itemEpoch === current;
}
function quarantineOwnerResetEntries(nextEpoch, message) {
  const current = String(nextEpoch || ownerSyncEpoch() || ''), now = new Date().toISOString(); let changed = false;
  OWNER_QUEUE.forEach(item => {
    if (!item.epoch) { item.epoch = OWNER_SYNC_EPOCH || current; changed = true; }
    if (String(item.epoch || '') !== current && item.state !== 'FAILED') {
      item.state = 'FAILED'; item.resetBlocked = true; item.failedAt = now; item.updatedAt = now;
      item.lastError = message || 'Cashbook was reset after this action was saved. It belongs to the earlier books and cannot be sent here.'; changed = true;
    }
  });
  if (current) OWNER_SYNC_EPOCH = current;
  return changed;
}
function updateOwnerSyncEpoch(value) {
  const next = String(value || ''); if (!next) return;
  const previous = OWNER_SYNC_EPOCH; OWNER_SYNC_EPOCH = next;
  let changed = false;
  OWNER_QUEUE.forEach(item => {
    if (!item.epoch) { item.epoch = previous || next; changed = true; }
    if (String(item.epoch) !== next && item.state !== 'FAILED') {
      item.state = 'FAILED'; item.resetBlocked = true; item.failedAt = new Date().toISOString(); item.updatedAt = item.failedAt;
      item.lastError = 'Cashbook was reset after this action was saved. It belongs to the earlier books and cannot be sent here.'; changed = true;
    }
  });
  if (changed) saveOwnerSync(); else setSyncBadge();
}
function loadOwnerSync() {
  try {
    const queued = ownerSyncRead('entry_queue', []), history = ownerSyncRead('entry_history', []);
    const storedEpoch = String(localStorage.getItem(ownerSyncKey('entry_epoch')) || '');
    OWNER_SYNC_TOMBSTONES = cleanOwnerTombstones(ownerSyncRead('entry_tombstones', {}));
    OWNER_QUEUE = (Array.isArray(queued) ? queued : []).filter(x => x && x.entry && x.clientId && !OWNER_SYNC_TOMBSTONES[x.clientId]).map(x => {
      const createdAt = x.createdAt || new Date().toISOString();
      return Object.assign({}, x, {state: x.state === 'SYNCING' ? 'PENDING' : (x.state || 'PENDING'), createdAt, updatedAt: x.updatedAt || x.failedAt || createdAt, epoch: String(x.epoch || storedEpoch || OWNER_SYNC_EPOCH || '')});
    });
    OWNER_SYNC_HISTORY = Array.isArray(history) ? history.filter(Boolean).slice(0, 150) : [];
    if (!OWNER_SYNC_EPOCH) OWNER_SYNC_EPOCH = String((L && L.epoch) || storedEpoch || '');
    const current = ownerSyncEpoch(); let changed = false;
    if (current) OWNER_QUEUE.forEach(item => {
      if (!item.epoch) { item.epoch = current; changed = true; }
      if (String(item.epoch) !== current && !item.resetBlocked) {
        item.state = 'FAILED'; item.resetBlocked = true; item.failedAt = new Date().toISOString(); item.updatedAt = item.failedAt;
        item.lastError = 'Cashbook was reset after this action was saved. It belongs to the earlier books and cannot be sent here.'; changed = true;
      }
    });
    if (changed) saveOwnerSync(); else setSyncBadge();
  } catch (e) { OWNER_QUEUE = []; OWNER_SYNC_HISTORY = []; OWNER_SYNC_TOMBSTONES = {}; setSyncBadge(); }
}
function saveOwnerSync() {
  try {
    // Merge another open tab's journal before writing ours. Tombstones stop a
    // stale tab from resurrecting an entry that was already synced/discarded.
    mergeOwnerBrowserQueue();
    localStorage.setItem(ownerSyncKey('entry_tombstones'), JSON.stringify(OWNER_SYNC_TOMBSTONES));
    localStorage.setItem(ownerSyncKey('entry_queue'), JSON.stringify(OWNER_QUEUE));
    if (ownerSyncEpoch()) localStorage.setItem(ownerSyncKey('entry_epoch'), ownerSyncEpoch());
  } catch (e) { toast('This browser could not keep the pending action. Reconnect and save again before closing.', true); return false; }
  // History is helpful, but the queue above is the durable record. Do not tell
  // someone that a safely stored financial action failed just because a
  // non-essential history write ran out of browser space.
  try { localStorage.setItem(ownerSyncKey('entry_history'), JSON.stringify(OWNER_SYNC_HISTORY.slice(0, 150))); } catch (e) {}
  setSyncBadge();
  return true;
}
function addOwnerSyncHistory(item, result, status) {
  OWNER_SYNC_HISTORY.unshift({clientId: item.clientId, type: item.type, label: item.label || ownerSyncLabel(item), createdAt: item.createdAt, savedAt: new Date().toISOString(), state: status || 'SAVED', docNo: result && result.docNo || item.entry.docNo || '', message: result && result.message || '', attempts: item.attempts || 0});
  OWNER_SYNC_HISTORY = OWNER_SYNC_HISTORY.slice(0, 150);
}
function queueOwnerEntry(entry) {
  if (!TOKEN || !ME) throw new Error('Sign in before saving an action on this browser.');
  if (!ownerSyncEpoch()) throw new Error('Connect once to refresh this updated app before saving browser-synced actions. This protects records after a reset.');
  const copy = JSON.parse(JSON.stringify(entry || {}));
  if (!OWNER_ENTRY_TYPES.has(String(copy.type || ''))) throw new Error('This action must be saved while online.');
  copy.clientId = copy.clientId || uid();
  let item = OWNER_QUEUE.find(x => x.clientId === copy.clientId), wasQueued = !!item;
  if (!item) {
    const createdAt = new Date().toISOString();
    item = {clientId: copy.clientId, type: copy.type, label: ownerSyncLabel(copy), entry: copy, state: 'PENDING', attempts: 0, createdAt, updatedAt: createdAt, epoch: ownerSyncEpoch(), lastError: ''};
    OWNER_QUEUE.push(item);
  }
  if (!saveOwnerSync()) {
    if (!wasQueued) OWNER_QUEUE = OWNER_QUEUE.filter(x => x.clientId !== copy.clientId);
    throw new Error('The browser could not save this action safely. Reconnect and try again.');
  }
  scheduleOwnerSync(250);
  return {queued: true, clientId: copy.clientId, docNo: 'Pending sync', flags: ['PENDING_SYNC']};
}
function scheduleOwnerSync(delay) {
  clearTimeout(OWNER_SYNC_TIMER);
  OWNER_SYNC_TIMER = setTimeout(() => {
    if (!TOKEN || OWNER_SYNCING || !ownerSyncCount('PENDING')) return;
    if (typeof navigator !== 'undefined' && navigator.onLine === false && !IN_SCRIPT) return;
    syncOwnerEntries(false);
  }, delay === undefined ? 350 : delay);
}
function syncOwnerEntries(manual) {
  if (OWNER_SYNCING) { if (manual) toast('Saved actions are already syncing.'); return Promise.resolve(); }
  const currentEpoch = ownerSyncEpoch();
  if (!currentEpoch) { if (manual) toast('Connect once to refresh this app before syncing browser-saved actions.', true); return Promise.resolve(); }
  const batch = OWNER_QUEUE.filter(x => x.state === 'PENDING' && !x.resetBlocked && ownerEntryMatchesCurrentBooks(x)).slice(0, 100);

    <div class="dates">${d.series.map(s => `<span><b>${s.d.slice(8)}</b>${WD[new Date(s.d + 'T12:00:00').getDay()]}</span>`).join('')}</div></div>`;

  <div class="period"><div class="period-head"><div class="period-cell"></div>${P.map(p => `<div class="period-cell num">${p[0]}</div>`).join('')}</div>
  ${row('Revenue', s => s.revenue)}${row('Units sold', Object.assign(s => s.qty, {fmt: s => qty(s.qty)}))}${row('Invoices', Object.assign(s => s.invoices, {fmt: s => s.invoices}))}
  ${row('Cost of goods & services', s => s.cogs)}${row('Gross profit', s => s.gross)}${row('Lost stock', s => s.stockAdjustments)}${row('Expenses', s => s.expenses)}${row('Net profit', s => s.net, true)}${row('Cash collected', s => s.cashIn)}${row('Owner money added', s => s.ownerContributions)}${row('Owner money withdrawn', s => s.ownerWithdrawals)}${row('Cash movement', s => s.cashNet, true)}</div>
  <div class="card hint"><b>Profit is not money available.</b> Profit is sales minus the cost of goods, stock losses and business expenses. <b>Cash movement</b> is money collected plus owner contributions, less supplier payments, expenses and owner withdrawals; it does not include your starting cash, unrecorded bank transfers or a cash count. <b>Lost stock</b> is the cost (what you paid, not the selling price) of goods that were damaged, stolen, expired or missing when counted. Stock found when counting is subtracted from it. It is not cash you paid out.</div>
  ${d.multiShop && !loc ? `<div class="card"><h3>Shops</h3>${table(['Shop', 'Revenue today', 'Revenue this month', 'Gross profit (month)', 'Lost stock (month)', 'Expenses (month)', 'Net profit (month)', 'Stock at cost'], d.shops.map(s => `<tr><td><a href="#" data-shop="${esc(s.id)}">${esc(s.name)}</a></td><td class="num">${money(s.todayRevenue)}</td><td class="num">${money(s.monthRevenue)}</td><td class="num">${money(s.monthGross)}</td><td class="num">${money(s.monthStockAdjustments)}</td><td class="num">${money(s.monthExpenses)}</td><td class="num ${cls(s.monthNet)}">${money(s.monthNet)}</td><td class="num">${money(s.stockValue)}</td></tr>`), {num: [1, 2, 3, 4, 5, 6, 7]})}</div>` : ''}
  <div class="grid g3"><div class="card"><div class="muted">Customers owe you</div><div class="big">${money(d.receivables)}</div></div>
  <div class="card"><div class="muted">You owe suppliers</div><div class="big">${money(d.payables)}</div></div>
  <div class="card"><div class="muted">Stock value at cost${loc ? ' (this shop)' : ''}</div><div class="big">${money(d.stockValue)}</div><div class="hint">${d.productCount} products and services</div></div></div>
  ${attn ? `<div class="card" style="border-color:#e0a100"><div class="row"><h3 style="flex:1">Needs your attention</h3><button class="ghost sm fit" id="ack">Mark all as reviewed</button></div>
  ${d.toReview.length ? `<p><span class="tag">New</span> <b>${d.toReview.length}</b> product${d.toReview.length > 1 ? 's' : ''} added by staff. Check the price, then open and save each to confirm: ${d.toReview.map(x => `<a href="#" data-prod="${esc(x.sku)}">${esc(x.name)}</a> (${x.type.toLowerCase()}, ${money(x.price)}, by ${esc(x.addedBy)})`).join(' · ')}</p>` : ''}
  ${d.uncosted.length ? `<p><span class="tag r">Cost needed</span> These cannot be sold until the owner updates their cost: ${d.uncosted.map(x => `<a href="#" data-prod="${esc(x.sku)}">${esc(x.name)}</a> <span class="hint">(${esc(x.issue)})</span>`).join(' · ')}</p>` : ''}
  ${d.rejected.map(r => `<p><span class="tag r">Rejected</span> ${esc(r.user)} · ${esc(r.time)}<br><span class="hint">${esc(r.detail)}</span></p>`).join('')}
  ${d.flagged.map(f => `<p><b>${esc(f.docNo)}</b> · ${esc(f.date)} · ${esc(f.rep)}${f.shop && d.multiShop ? ' · ' + esc(f.shop) : ''} ${flagTags(f.flags)}</p>`).join('')}
  <p class="hint">Rejected entries were not posted: re-enter them under Record if they were real. Flagged entries were posted but need a look.</p></div>` : ''}
  <div class="grid g2"><div class="card"><h3>Revenue, last 14 days <span class="hint">(${CUR}; k = thousand, M = million)</span></h3>${chart}</div>
  <div class="card"><h3>Low stock</h3>${table(['Product', 'Left', 'Reorder at'], d.lowStock.map(p => `<tr><td>${esc(p.name)}<div class="hint">${esc(p.sku)}${p.shop ? ' · ' + esc(p.shop) : ''}</div></td><td class="num ${p.stock <= 0 ? 'neg' : ''}">${qty(p.stock)} ${esc(p.unit)}</td><td class="num">${qty(p.reorder)}</td></tr>`), {num: [1, 2], empty: 'Nothing is below its reorder level.'})}</div></div>
  <div class="card"><h3>Sales staff this week</h3>${table(['Who', 'Today revenue', 'Today collected', 'Today expenses', 'Week units', 'Week revenue', 'Week collected', 'Week expenses'],
    d.reps.map(r => `<tr><td>${esc(r.rep)}</td><td class="num">${money(r.todayRevenue)}</td><td class="num">${money(r.todayCollected)}</td><td class="num">${money(r.todayExpenses)}</td><td class="num">${qty(r.weekQty)}</td><td class="num">${money(r.weekRevenue)}</td><td class="num">${money(r.weekCollected)}</td><td class="num">${money(r.weekExpenses)}</td></tr>`), {num: [1, 2, 3, 4, 5, 6, 7], empty: 'No sales activity yet this week.'})}
  <p class="hint">“Collected” is cash received (including part-payments at sale). Compare it with what each person hands over.</p></div>
  <div class="grid g2"><div class="card"><h3>Biggest debtors</h3>${table(['Customer', 'Owes'], d.debtors.map(c => `<tr><td><a href="#" data-st="${c.id}">${esc(c.name)}</a><div class="hint">${esc(c.phone)}</div></td><td class="num">${money(c.balance)}</td></tr>`), {num: [1], empty: 'Nobody owes you anything.'})}</div>
  <div class="card"><h3>You owe</h3>${table(['Supplier', 'Balance'], d.creditors.map(c => `<tr><td><a href="#" data-st="${c.id}">${esc(c.name)}</a></td><td class="num">${money(c.balance)}</td></tr>`), {num: [1], empty: 'You owe no supplier.'})}</div></div>`;
  const ss = $('#shop'); if (ss) { ss.value = loc; ss.onchange = () => { VIEW_STATE.shop = ss.value; refresh('dashboard'); }; }
  m.querySelectorAll('[data-start]').forEach(b => b.onclick = () => { if (b.dataset.start === 'details') go('settings'); else if (b.dataset.start === 'products') go('products'); else if (b.dataset.start === 'opening') { VIEW_STATE.recordSection = 'stock'; VIEW_STATE.recordType = 'OPENING'; go('stock'); } else go('openingBalances'); });
  const ack = $('#ack'); if (ack) ack.onclick = () => run(ack, async () => { await api('ackAttention'); refresh('dashboard'); });
  m.querySelectorAll('[data-st]').forEach(a => a.onclick = e => { e.preventDefault(); statement(a.dataset.st); });
  m.querySelectorAll('[data-shop]').forEach(a => a.onclick = e => { e.preventDefault(); VIEW_STATE.shop = a.dataset.shop; refresh('dashboard'); });
  m.querySelectorAll('[data-prod]').forEach(a => a.onclick = e => { e.preventDefault(); VIEW_STATE.openProduct = a.dataset.prod; refresh('products'); });
}

// Home is deliberately a compact set of cards rather than a dense accounting
// table. Every figure is an affordance: selecting it opens the related records.
function drawDash(m, d, loc, stale) {
  const attention = d.flagged.length + d.rejected.length + d.toReview.length + d.uncosted.length;
  const todayDate = today();
  const startOfMonth = todayDate.slice(0, 8) + '01';
  const card = (label, value, note, route, tone) => `<button type="button" class="metric-card ${tone || ''}" data-home-route="${route}" aria-label="Open ${esc(label)} details"><span class="metric-label">${esc(label)}</span><span class="metric-value">${value}</span><span class="metric-note">${note}</span><span class="metric-link">View details →</span></button>`;
  const guide = (tab, text, route) => `<button type="button" class="tab-guide-card" data-home-route="${route}"><b>${esc(tab)}</b><span>${esc(text)}</span></button>`;
  setBadge(attention);
  m.classList.toggle('stale', !!stale);
  m.innerHTML = `<div class="row"><h1 style="flex:1 1 200px">Home${loc ? ' — ' + esc(shopName(loc)) : ''}</h1>${shopSel('shop')}</div>
  <p class="muted">A clear picture of today’s trading. Select any card to open the records behind the number.${d.closedUntil ? ' Books closed up to ' + esc(d.closedUntil) + '.' : ''}</p>
  ${!d.productCount ? `<div class="card"><h3>Get ready to start selling</h3><p class="muted">Set up business details, products, stock already owned and starting balances before the first sale.</p><div class="row"><button class="ghost" data-home-route="settings">Business details & payment methods</button><button class="ghost" data-home-route="products">Add products or services</button><button class="ghost" data-home-route="opening">Add opening stock</button><button class="ghost" data-home-route="balances">Record starting balances</button></div></div>` : ''}
  <section class="home-section" aria-labelledby="today-title"><div class="home-section-head"><h2 id="today-title">Today’s trading</h2><p>Sales, profit and money received.</p></div><div class="metric-grid">
    ${card('Sales', money(d.today.revenue), `${d.today.invoices} invoice${d.today.invoices === 1 ? '' : 's'} · ${qty(d.today.qty)} units sold`, 'sales-today', 'money')}
    ${card('Gross profit', money(d.today.gross), `Sales less the cost of items sold`, 'reports-today', d.today.gross < 0 ? 'danger' : 'good')}
    ${card('Net profit', money(d.today.net), `After expenses and stock losses`, 'reports-today', d.today.net < 0 ? 'danger' : 'good')}
    ${card('Money received', money(d.today.cashIn), `Payments collected today`, 'payments-today', 'money')}
  </div></section>
  <section class="home-section" aria-labelledby="position-title"><div class="home-section-head"><h2 id="position-title">Money position</h2><p>What is owed and what changed in cash today.</p></div><div class="metric-grid">
    ${card('Customers owe you', money(d.receivables), 'Open customer balances and statements', 'customers', d.receivables ? 'warn' : 'good')}
    ${card('You owe suppliers', money(d.payables), 'Open supplier balances and statements', 'suppliers', d.payables ? 'warn' : 'good')}
    ${card('Cash movement', money(d.today.cashNet), 'Received, paid out and owner money today', 'reports-today', d.today.cashNet < 0 ? 'danger' : 'money')}
    ${card('Owner money', money(d.today.ownerContributions - d.today.ownerWithdrawals), `${money(d.today.ownerContributions)} added · ${money(d.today.ownerWithdrawals)} withdrawn`, 'money', 'money')}
  </div></section>
  <section class="home-section" aria-labelledby="control-title"><div class="home-section-head"><h2 id="control-title">Stock & control</h2><p>Inventory and items that need a decision.</p></div><div class="metric-grid">
    ${card('Stock value', money(d.stockValue), `${d.productCount} active product${d.productCount === 1 ? '' : 's'} and service${d.productCount === 1 ? '' : 's'}`, 'products', 'money')}
    ${card('Low stock', String(d.lowStock.length), d.lowStock.length ? 'Open products needing replenishment' : 'All recorded stock is above its reorder level', 'low-stock', d.lowStock.length ? 'warn' : 'good')}
    ${card('Needs attention', String(attention), attention ? 'Flagged, rejected or unreviewed entries' : 'No issues are waiting for review', 'attention', attention ? 'danger' : 'good')}
    ${card('Sales this month', money(d.month.revenue), `Net profit ${money(d.month.net)} this month`, 'reports-month', d.month.net < 0 ? 'danger' : 'money')}
  </div></section>
  <div class="card hint"><b>Profit is not cash available.</b> Profit is sales less the cost of goods, stock losses and business expenses. Cash movement also includes customer and supplier payments plus owner contributions and withdrawals.</div>
  <section class="tab-guide card" aria-labelledby="tab-guide-title"><h2 id="tab-guide-title">What each tab does</h2><p class="muted">Use these short routes for everyday work; detailed administration is kept under More.</p><div class="tab-guide-grid">
    ${guide('Home', 'Your daily picture: sales, balances, stock and items needing attention.', 'home')}
    ${guide('Sell', 'New sales, customer payments, returns and refunds.', 'sell')}
    ${guide('Buy', 'Receive goods, record supplier purchases and supplier payments.', 'buy')}
    ${guide('Stock', 'Opening stock, physical count corrections and stock movements.', 'stock')}
    ${guide('Money', 'Business expenses plus owner contributions and withdrawals.', 'money')}
    ${guide('Reports', 'Sales, profit, stock, expenses and outstanding-balance reports.', 'reports')}
    ${guide('Sync', 'Browser-saved actions, pending syncs and failed-sync retries.', 'sync')}
    ${guide('More', 'Transactions, products, contacts, team access and settings.', 'more')}
  </div></section>`;
  const shop = $('#shop'); if (shop) { shop.value = loc; shop.onchange = () => { VIEW_STATE.shop = shop.value; go('dashboard'); }; }
  const route = key => {
    if (key === 'home') return go('dashboard');
    if (key === 'sales-today') { VIEW_STATE.txPreset = {type: 'SALE', from: todayDate, to: todayDate}; return go('transactions'); }
    if (key === 'payments-today') { VIEW_STATE.txPreset = {type: 'PAYMENT_IN', from: todayDate, to: todayDate}; return go('transactions'); }
    if (key === 'attention') { VIEW_STATE.txPreset = {}; return go('transactions'); }
    if (key === 'reports-today') { VIEW_STATE.reportPreset = {group: 'day', from: todayDate, to: todayDate}; return go('reports'); }
    if (key === 'reports-month') { VIEW_STATE.reportPreset = {group: 'month', from: startOfMonth, to: todayDate}; return go('reports'); }
    if (key === 'customers') { VIEW_STATE.partyTab = 'CUSTOMER'; return go('parties'); }
    if (key === 'suppliers') { VIEW_STATE.partyTab = 'SUPPLIER'; return go('parties'); }
    if (key === 'low-stock') { VIEW_STATE.pLow = true; return go('products'); }
    if (key === 'products') { VIEW_STATE.pLow = false; return go('products'); }
    if (key === 'opening') { VIEW_STATE.recordSection = 'stock'; VIEW_STATE.recordType = 'OPENING'; return go('stock'); }
    if (key === 'balances') return go('openingBalances');
    return go(key);
  };
  m.querySelectorAll('[data-home-route]').forEach(b => b.onclick = () => route(b.dataset.homeRoute));
}

};

VIEWS.sell = (m, token) => { VIEW_STATE.recordSection = 'sell'; return VIEWS.record(m, token); };
VIEWS.buy = (m, token) => { VIEW_STATE.recordSection = 'buy'; return VIEWS.record(m, token); };

VIEWS.money = (m, token) => { VIEW_STATE.recordSection = 'money'; return VIEWS.record(m, token); };
VIEWS.sync = (m, token) => {
  const waiting = OWNER_QUEUE.filter(x => x.state === 'PENDING' || x.state === 'SYNCING');
  const failed = OWNER_QUEUE.filter(x => x.state === 'FAILED');
  const retryable = failed.filter(x => !x.resetBlocked && ownerEntryMatchesCurrentBooks(x));
  const shownTime = value => { if (!value) return '—'; const d = new Date(value); return Number.isNaN(d.getTime()) ? String(value) : d.toLocaleString(); };
  const row = (item, problem) => `<tr><td><b>${esc(item.label || ownerSyncLabel(item))}</b><div class="hint">${esc(item.type || '')}${item.entry && item.entry.docNo ? ' · ' + esc(item.entry.docNo) : ''}</div></td><td>${esc(shownTime(item.createdAt))}</td><td>${item.state === 'SYNCING' ? '<span class="tag">Syncing</span>' : item.state === 'FAILED' ? '<span class="tag r">Needs attention</span>' : '<span class="tag">Pending sync</span>'}</td><td>${problem ? `<span class="neg">${esc(item.lastError || 'The server rejected this action.')}</span>` : esc(item.lastError || (item.state === 'SYNCING' ? 'Sending to Cashbook…' : 'Waiting for a connection or the next quiet sync.'))}</td><td class="num">${item.state === 'FAILED' && !item.resetBlocked && ownerEntryMatchesCurrentBooks(item) ? `<button class="ghost sm" data-retry="${esc(item.clientId)}">Retry</button> ` : ''}<button class="ghost sm" data-discard="${esc(item.clientId)}" ${item.state === 'SYNCING' ? 'disabled' : ''}>Discard</button></td></tr>`;
  const totalWaiting = waiting.length, totalFailed = failed.length;
  const state = OWNER_SYNCING ? 'Syncing now' : totalFailed ? 'Needs attention' : totalWaiting ? 'Pending sync' : 'Saved';
  const stateClass = totalFailed ? 'neg' : totalWaiting || OWNER_SYNCING ? '' : 'pos';
  m.innerHTML = `<div class="row"><div style="flex:1"><h1>Sync centre</h1><p class="muted">Each daily record is saved on this browser first, then sent quietly to Cashbook. It affects stock, balances and reports only after it is marked Saved.</p></div><div class="fit"><button class="ghost" id="sync-copy">Download copy</button></div><div class="fit"><button id="sync-now" ${OWNER_SYNCING ? 'disabled' : ''}>${OWNER_SYNCING ? 'Syncing…' : 'Sync now'}</button></div></div>
  <div class="grid g3"><div class="card"><div class="muted">Status</div><div class="big ${stateClass}">${esc(state)}</div><div class="hint">${totalFailed ? `${totalFailed} action${totalFailed === 1 ? '' : 's'} need review` : totalWaiting ? `${totalWaiting} action${totalWaiting === 1 ? '' : 's'} waiting` : 'No saved browser actions waiting'}</div></div><div class="card"><div class="muted">Waiting to sync</div><div class="big">${totalWaiting}</div><div class="hint">Saved safely on this browser</div></div><div class="card"><div class="muted">Failed syncs</div><div class="big ${totalFailed ? 'neg' : ''}">${totalFailed}</div><div class="hint">Retry after correcting the reason</div></div></div>
  <div class="card hint"><b>What syncs automatically:</b> sales, purchases, payments, returns, expenses, stock corrections, owner money and reversals. <b>Stay online for:</b> product setup, imports, staff and settings changes, backups, period closing and deletions. A failed entry is never silently retried. Retry only after an external condition is fixed (for example, stock has been received); otherwise discard it and enter a corrected new record.</div>
  <div class="card"><div class="row"><h2 style="flex:1">Waiting on this browser</h2><span class="hint">${OWNER_SYNCING ? 'Sending now…' : 'The app retries when it reconnects or becomes active.'}</span></div>${table(['Action', 'Saved on browser', 'State', 'Details', ''], waiting.map(x => row(x, false)), {empty: 'Nothing is waiting to sync.', num: [4]})}</div>
  <div class="card"><div class="row"><h2 style="flex:1">Needs attention</h2>${retryable.length ? '<button class="ghost" id="retry-failed">Retry all eligible</button>' : ''}</div><p class="hint">A rejected action has not entered the books. If the reason is permanent, discard it and enter a corrected new record. Actions from an earlier reset are kept for reconciliation only; download a copy before discarding them.</p>${table(['Action', 'Saved on browser', 'State', 'Reason', ''], failed.map(x => row(x, true)), {empty: 'No failed syncs.', num: [4]})}</div>
  <div class="card"><h2>Recent browser sync activity</h2>${table(['Action', 'Saved on browser', 'Result', 'Document / note'], OWNER_SYNC_HISTORY.slice(0, 20).map(x => `<tr><td><b>${esc(x.label || ownerSyncLabel(x))}</b><div class="hint">${esc(x.type || '')}</div></td><td>${esc(shownTime(x.createdAt))}</td><td>${x.state === 'SAVED' ? '<span class="pos">Saved</span>' : '<span class="muted">Discarded</span>'}</td><td>${esc(x.docNo || x.message || '—')}</td></tr>`), {empty: 'Your recent browser sync activity will appear here.', num: []})}</div>`;
  const syncNow = m.querySelector('#sync-now'); if (syncNow) syncNow.onclick = () => syncOwnerEntries(true);
  const syncCopy = m.querySelector('#sync-copy'); if (syncCopy) syncCopy.onclick = () => exportOwnerSync();
  const retryAll = m.querySelector('#retry-failed'); if (retryAll) retryAll.onclick = () => retryFailedOwnerEntries();
  m.querySelectorAll('[data-retry]').forEach(b => b.onclick = () => retryOwnerEntry(b.dataset.retry));
  m.querySelectorAll('[data-discard]').forEach(b => b.onclick = () => discardOwnerEntry(b.dataset.discard));
};

function lineEditor(kind) {

      docs.map((d, i) => `<tr class="${d.reversed ? 'rev' : ''}"><td>${esc(d.date)}</td><td><b>${esc(d.docNo)}</b>${d.reversed ? ' <span class="tag r">reversed</span>' : ''}<div>${flagTags(d.flags)}</div></td><td>${TYPES[d.type] || d.type}</td>
       <td>${esc(d.party || d.category || '')}<div class="hint">${esc(d.notes)}</div></td><td>${esc(multi() ? d.shop + ' · ' + d.rep : d.rep)}</td><td class="num">${['ADJUSTMENT', 'COST_REVALUE', 'TRANSFER', 'PRODUCT_ADDED'].includes(d.type) ? '' : money(d.amount || d.paid || d.refunded)}</td><td class="num">${d.type === 'RETURN' ? (d.refunded ? 'Refunded ' + money(d.refunded) : '—') : d.amount ? money(d.paid) : ''}</td>
      <td class="num"><button class="ghost sm" data-d="${i}">Details</button></td></tr>`), {num: [5, 6]});

  }

  let last = null; const sh = m.querySelector('#sh'), group = m.querySelector('#g'), from = m.querySelector('#fr'), to = m.querySelector('#to'), goButton = m.querySelector('#go'), download = m.querySelector('#dl'); if (sh) sh.value = VIEW_STATE.shop || '';

  });

  <div class="card"><h3>Sales app link</h3><p>Staff paste this link into the sales app the first time they sign in. Your install link (see the guide) can carry it for them.</p><input readonly value="${esc(c.webAppUrl || 'Not available — copy it from Deploy → Manage deployments')}" onclick="this.select()"></div>
  <div class="card"><h3>Shops</h3><p class="hint">Each shop keeps its own stock and its own FIFO layers. Staff work in one shop. Sales, expenses and profit can be viewed per shop or for the whole company. Customers and suppliers are shared.</p>
  ${table(['Shop', 'Address', ''], (L.locations || []).map(s => `<tr class="${s.active ? '' : 'rev'}"><td><b>${esc(s.name)}</b><div class="hint">${esc(s.id)}</div></td><td>${esc(s.address)}</td><td class="num"><button class="ghost sm" data-ls="${esc(s.id)}">Edit</button></td></tr>`))}<p style="margin-top:.8rem"><button id="addshop">Open a new shop</button></p></div>
  <div class="card"><h3>Business details</h3><div class="row"><div><label>Company name</label><input id="c-CompanyName" value="${esc(v.CompanyName)}"></div><div><label>Currency symbol</label><input id="c-Currency" value="${esc(v.Currency)}"></div><div><label>Alert email (daily summary)</label><input id="c-AlertEmail" value="${esc(v.AlertEmail)}"></div></div>
  <div class="row" style="margin-top:.7rem"><div><label>Expense categories (comma separated)</label><input id="c-ExpenseCategories" value="${esc(v.ExpenseCategories)}"></div><div><label>Payment methods</label><input id="c-PaymentMethods" value="${esc(v.PaymentMethods)}"></div></div>
  <div class="row" style="margin-top:.7rem"><div><label>Target profit margin % (for suggested prices)</label><input id="c-TargetMarginPct" type="number" value="${esc(v.TargetMarginPct)}"></div><div><label>Service categories (bulk-added products in these become services)</label><input id="c-ServiceCategories" value="${esc(v.ServiceCategories)}"></div></div>
  <div class="row" style="margin-top:.7rem"><div><label>Receipt footer</label><input id="c-ReceiptFooter" value="${esc(v.ReceiptFooter)}"></div><div><label>Sales staff see</label><select id="c-RepsSeeCompanyTotals"><option value="FALSE" ${v.RepsSeeCompanyTotals !== 'TRUE' ? 'selected' : ''}>Only their own totals</option><option value="TRUE" ${v.RepsSeeCompanyTotals === 'TRUE' ? 'selected' : ''}>Their shop's totals</option></select></div>
  <div><label>Keep backups (days)</label><input id="c-BackupKeepDays" type="number" value="${esc(v.BackupKeepDays)}"></div></div>
  <div class="row" style="margin-top:.7rem"><div><label>When a sale is bigger than the recorded stock</label><select id="c-OversellPolicy"><option value="BLOCK" ${v.OversellPolicy !== 'FLAG' ? 'selected' : ''}>Block it (entries made online are refused)</option><option value="FLAG" ${v.OversellPolicy === 'FLAG' ? 'selected' : ''}>Allow it, but flag it for my review</option></select><p class="hint">Staff using the sales app offline cannot be stopped after the fact, because the goods have already left. Those sales are always recorded and flagged. The sales app itself warns or blocks, following this setting.</p></div></div><p><button id="save">Save settings</button></p></div>
  <div class="card"><h3>Close a period</h3><p>${v.ClosedUntil ? 'Books are closed up to <b>' + esc(v.ClosedUntil) + '</b>.' : 'No period is closed yet.'} Closing locks the figures: nothing can be posted on or before that date, and late entries from staff are dated the next open day and flagged.</p>
  <div class="row"><div><label>Close everything up to and including</label><input type="date" id="cl" max="${c.today}"></div><div class="fit"><button id="close" class="danger">Close period</button></div></div></div>
  <div class="card"><h3>Safety checks</h3><div class="row"><div class="fit"><button class="ghost" id="bk">Back up now</button></div><div class="fit"><button class="ghost" id="ic">Check data integrity</button></div><div class="fit"><button class="ghost" id="rc">Repair from ledger</button></div><div class="fit"><button class="ghost" id="au">View audit log</button></div></div><div id="out"></div></div>
  <div class="card danger-zone"><h3>Danger zone — delete data permanently</h3><p>Use this to clear test entries before you go live, or to start again. <b>Deleted data cannot be brought back from this app.</b> A full copy of the spreadsheet is saved to Google Drive (folder <i>Cashbook Backups</i>) just before anything is deleted, and the reset is written to the audit log.</p>
  <div class="row" style="margin-bottom:.4rem"><div class="fit"><button class="ghost sm" id="rz-test">Preset: clear my test transactions</button></div><div class="fit"><button class="ghost sm" id="rz-all">Preset: everything except my login</button></div></div>
  <div id="rz-list" class="muted">Loading what can be deleted…</div>
  <div class="row" style="margin-top:.8rem"><div><label>Your password</label><input id="rz-pw" type="password" autocomplete="current-password"></div><div><label>Type DELETE to confirm</label><input id="rz-ph" autocomplete="off"></div><div class="fit"><button class="danger" id="rz-go">Delete permanently</button></div></div></div>
  <div class="card"><h3>Your password</h3><div class="row"><div><label>Current</label><input id="pw0" type="password"></div><div><label>New (8+ characters)</label><input id="pw1" type="password"></div><div class="fit"><button id="pw">Change</button></div></div></div>
  <p class="hint">Cashbook v${esc(c.version)} · time zone ${esc(c.timezone)} · today is ${esc(c.today)}</p>`;
  const shopForm = s => { const mo = modal(s ? 'Edit ' + s.name : 'Open a new shop', `<div class="field"><label>Shop name</label><input id="s-n" value="${esc(s ? s.name : '')}"></div><div class="field"><label>Address</label><input id="s-a" value="${esc(s ? s.address : '')}"></div>
    ${s ? `<label><input type="checkbox" id="s-act" style="width:auto;min-height:0" ${s.active ? 'checked' : ''}> Open (untick to close it — only possible when it holds no stock and has no staff)</label>` : '<p class="hint">A new shop starts with no stock. Load it with Record → Opening stock or Stock in, or move stock from another shop. Then create its staff under Team.</p>'}<p><button id="s-s">Save</button></p>`);
    $('#s-s').onclick = e => run(e.target, async () => { await api('saveLocation', {location: {id: s ? s.id : undefined, name: $('#s-n').value, address: $('#s-a').value, active: s ? $('#s-act').checked : undefined}}); mo.close(); await refreshLists(); toast('Saved'); refresh('settings'); }); };
  $('#addshop').onclick = () => shopForm(null); m.querySelectorAll('[data-ls]').forEach(b => b.onclick = () => shopForm(L.locations.find(s => s.id === b.dataset.ls)));
  $('#save').onclick = e => run(e.target, async () => { const values = {}; Object.keys(v).filter(k => k !== 'ClosedUntil').forEach(k => values[k] = $('#c-' + k).value); await api('saveConfig', {values}); await refreshLists(); toast('Settings saved'); });
  $('#close').onclick = e => run(e.target, async () => { if (!confirm('Close all periods up to ' + $('#cl').value + '? This cannot be undone from the dashboard.')) return; await api('closePeriod', {date: $('#cl').value}); toast('Period closed'); refresh('settings'); });
  $('#bk').onclick = e => run(e.target, async () => { const r = await api('backup', {xlsx: true}); toast('Backup saved: ' + r.file); });
  const showIssues = (issues, intro) => { if (!viewAlive(view, token, m)) return; const out = m.querySelector('#out'); if (out) out.innerHTML = intro + (issues.length ? `<p class="neg">${issues.length} problem${issues.length > 1 ? 's' : ''} found:</p><ul>${issues.slice(0, 25).map(i => `<li>${esc(i.msg)}<div class="hint">${esc(i.hint || '')}</div></li>`).join('')}</ul>` : '<p class="pos">All good. Stock, balances and cost layers agree with the ledger.</p>'); };
  $('#ic').onclick = e => run(e.target, async () => { const r = await api('integrity'); showIssues(r.issues, r.ok ? '' : '<p class="hint">The ledger is the master record. Everything else is worked out from it. “Repair” rebuilds the rest from the ledger and tells you exactly what it changed.</p>'); });
  $('#rc').onclick = e => run(e.target, async () => { const r = await api('recalc'); showIssues(r.remaining, r.fixed ? `<p class="pos">${r.fixed} thing${r.fixed > 1 ? 's' : ''} repaired from the ledger:</p><ul>${r.details.map(d => `<li>${esc(d)}</li>`).join('')}</ul>` : '<p class="muted">Nothing needed repairing.</p>'); toast(r.fixed + ' repaired'); });
  $('#au').onclick = e => run(e.target, async () => { const r = await api('audit'); if (!viewAlive(view, token, m)) return; const out = m.querySelector('#out'); if (out) out.innerHTML = table(['Time', 'User', 'Action', 'Result', 'Detail'], r.rows.map(x => `<tr><td>${esc(x.time)}</td><td>${esc(x.user)}</td><td>${esc(x.action)}</td><td>${esc(x.result)}</td><td class="hint">${esc(x.detail)}</td></tr>`)); });
  api('resetPreview').then(pv => {
    if (!viewAlive(view, token, m)) return;
    const info = {transactions: pv.counts.transactions + ' ledger rows, ' + pv.counts.batches + ' stock layers', products: pv.counts.products + ' products and services', parties: pv.counts.parties + ' customers and suppliers', staff: pv.counts.staff + ' other accounts', shops: pv.counts.shops + ' extra shops', audit: pv.counts.audit + ' log rows', settings: 'back to defaults'};
    const list = m.querySelector('#rz-list'), test = m.querySelector('#rz-test'), all = m.querySelector('#rz-all'); if (!list || !test || !all) return;
    list.innerHTML = Object.keys(pv.scopes).map(k => `<label class="chk"><input type="checkbox" class="rz" value="${k}"><span><b>${esc(pv.scopes[k])}</b><br><span class="hint">${esc(info[k])}</span></span></label>`).join('') + '<p class="hint">Products, customers, suppliers and shops are used by past transactions, so ticking any of them also ticks “All transactions”.</p>';
    const set = (keys) => m.querySelectorAll('.rz').forEach(c => c.checked = keys.includes(c.value));
    m.querySelectorAll('.rz').forEach(c => c.onchange = () => { if (c.checked && ['products', 'parties', 'shops'].includes(c.value)) { const transactions = m.querySelector('.rz[value=transactions]'); if (transactions) transactions.checked = true; } if (!c.checked && c.value === 'transactions') m.querySelectorAll('.rz').forEach(x => { if (['products', 'parties', 'shops'].includes(x.value)) x.checked = false; }); });
    test.onclick = () => set(['transactions']); all.onclick = () => set(Object.keys(pv.scopes));
  }).catch(() => { if (!viewAlive(view, token, m)) return; const list = m.querySelector('#rz-list'); if (list) list.textContent = 'Could not load.'; });
  $('#rz-go').onclick = e => run(e.target, async () => {
    const scopes = [...document.querySelectorAll('.rz:checked')].map(x => x.value); if (!scopes.length) throw new Error('Tick at least one thing to delete.');
    if (!confirm('This permanently deletes: ' + scopes.join(', ') + '.\n\nA backup copy is saved to Google Drive first. Continue?')) return;
    const r = await api('factoryReset', {scopes, password: $('#rz-pw').value, phrase: $('#rz-ph').value}); L = null; dropCache(); await refreshLists();
    if (!viewAlive(view, token, m)) return;
    const list = m.querySelector('#rz-list'), password = m.querySelector('#rz-pw'), phrase = m.querySelector('#rz-ph'); if (list) list.innerHTML = `<p class="pos"><b>Done.</b> Deleted: ${esc(r.scopes.join(', '))}.</p><p class="hint">Safety backup: ${esc(r.backup)}. Staff apps will drop any entries they had not synced when they next connect.</p>`; if (password) password.value = ''; if (phrase) phrase.value = ''; toast('Deleted. Backup saved to Drive.');
  });
  $('#pw').onclick = e => run(e.target, async () => { await api('changePin', {oldPin: $('#pw0').value, newPin: $('#pw1').value}); if (!viewAlive(view, token, m)) return; toast('Password changed'); const oldPin = m.querySelector('#pw0'), newPin = m.querySelector('#pw1'); if (oldPin) oldPin.value = ''; if (newPin) newPin.value = ''; });
};

/* ---------- start ---------- */
loadKept();
if ('serviceWorker' in navigator && /^https?:/.test(location.protocol) && !IN_SCRIPT) navigator.serviceWorker.register('sw.js').catch(() => {});
if (TOKEN) {
  const kept = MEM[ckey('lists')];
  if (kept) { L = kept; CUR = L.currency; updateOwnerSyncEpoch(L.epoch); LSTALE = true; draw_shell(); }               // open instantly with what we remember, then check it
  else boot();
} else showLogin();
</script>
</body>
</html>
